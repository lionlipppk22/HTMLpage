<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>英文單字學習卡</title>
<script src="vocab.js"></script>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, 'Helvetica Neue', 'Noto Sans TC', sans-serif;
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    touch-action: pan-y;
  }

  .container {
    width: 100%;
    max-width: 400px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  /* ── 9:16 Card ── */
  .card-wrapper {
    width: 100%;
    max-height: 80dvh;
    aspect-ratio: 9 / 16;
    position: relative;
    overflow: hidden;
    border-radius: 20px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    perspective: 1200px;
    touch-action: none;
    user-select: none;
  }

  .card {
    width: 100%;
    height: 100%;
    padding: 28px 24px 20px;
    display: flex;
    flex-direction: column;
    background: linear-gradient(145deg, #ffffff 0%, #f0f4ff 100%);
    transition: none;
    position: relative;
  }

  .card.slide-out-left {
    transition: transform 0.4s cubic-bezier(0.55, 0, 0.1, 1), opacity 0.4s ease;
    transform: translateX(-120%) scale(0.85);
    opacity: 0;
  }
  .card.slide-out-right {
    transition: transform 0.4s cubic-bezier(0.55, 0, 0.1, 1), opacity 0.4s ease;
    transform: translateX(120%) scale(0.85);
    opacity: 0;
  }
  .card.slide-in-from-left {
    transition: transform 0.4s cubic-bezier(0.55, 0, 0.1, 1), opacity 0.4s ease;
    transform: translateX(0) scale(1);
    opacity: 1;
  }
  .card.slide-in-from-right {
    transition: transform 0.4s cubic-bezier(0.55, 0, 0.1, 1), opacity 0.4s ease;
    transform: translateX(0) scale(1);
    opacity: 1;
  }

  /* ── Card content layout ── */
  .card-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    text-align: center;
  }

  .card-word {
    font-size: 3rem;
    font-weight: 700;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.25;
    letter-spacing: 0.02em;
  }

  .card-phonetic {
    font-size: 1.15rem;
    color: #888;
    margin-top: 8px;
    font-family: 'Times New Roman', serif;
  }

  .card-divider {
    width: 48px;
    height: 2px;
    background: #ddd;
    margin: 16px 0;
  }
  .card-pos-meaning {
    font-size: 1.3rem;
    color: #333;
    line-height: 1.5;
  }
  .card-pos-meaning .pos {
    color: #666;
    font-weight: 500;
  }

  .card-example {
    margin-top: 20px;
    font-size: 1.05rem;
    font-style: italic;
    color: #555;
    line-height: 1.5;
    max-width: 90%;
  }
  .card-example::before { content: "\201C"; }
  .card-example::after  { content: "\201D"; }

  .card-speaker {
    align-self: flex-end;
    margin-top: auto;
    background: none;
    border: none;
    font-size: 2rem;
    cursor: pointer;
    padding: 8px 12px;
    border-radius: 50%;
    transition: background 0.2s, transform 0.2s;
    line-height: 1;
  }
  .card-speaker:hover,
  .card-speaker:active {
    background: #f0f0f0;
    transform: scale(1.15);
  }
  .nav-row {
    display: flex;
    align-items: center;
    gap: 20px;
    width: 100%;
    justify-content: center;
  }

  .nav-btn {
    background: rgba(255,255,255,0.12);
    border: none;
    color: #fff;
    font-size: 1.6rem;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .nav-btn:hover {
    background: rgba(255,255,255,0.22);
  }
  .nav-btn:active {
    transform: scale(0.92);
  }

  /* ── Progress text ── */
  .progress-text {
    color: rgba(255,255,255,0.7);
    font-size: 0.9rem;
    letter-spacing: 0.05em;
  }

  /* ── Dots ── */
  .dots {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    transition: background 0.3s, transform 0.3s;
  }
  .dot.active {
    background: #fff;
    transform: scale(1.3);
  }
</style>
</head>
<body>

<div class="container">
  <!-- Card -->
  <div class="card-wrapper" id="cardWrapper">
    <div class="card" id="card">
      <div class="card-content" id="cardContent">
        <div class="card-word" id="wordEl"></div>
        <div class="card-phonetic" id="phoneticEl"></div>
        <div class="card-divider"></div>
        <div class="card-pos-meaning" id="posMeaningEl"></div>
        <div class="card-example" id="exampleEl"></div>
        <button class="card-speaker" id="speakerBtn" aria-label="播放發音">🔊</button>
      </div>
    </div>
  </div>

  <!-- Progress text -->
  <div class="progress-text" id="progressText"></div>

  <!-- Dots -->
  <div class="dots" id="dots"></div>

  <!-- Nav buttons -->
  <div class="nav-row">
    <button class="nav-btn" id="prevBtn" aria-label="上一個單字">◀</button>
    <button class="nav-btn" id="nextBtn" aria-label="下一個單字">▶</button>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ── State ──
  const index = { current: 0 };
  const animating = { value: false };
  const card = document.getElementById('card');

  // ── DOM refs ──
  const wordEl        = document.getElementById('wordEl');
  const phoneticEl    = document.getElementById('phoneticEl');
  const posMeaningEl  = document.getElementById('posMeaningEl');
  const exampleEl     = document.getElementById('exampleEl');
  const speakerBtn    = document.getElementById('speakerBtn');
  const progressText  = document.getElementById('progressText');
  const dotsEl        = document.getElementById('dots');
  const prevBtn       = document.getElementById('prevBtn');
  const nextBtn       = document.getElementById('nextBtn');
  const cardWrapper   = document.getElementById('cardWrapper');

  // ── Render ──
  function renderCard(i) {
    const w = words[i];
    if (!w) return;
    wordEl.textContent       = w.word;
    phoneticEl.textContent   = w.phonetic;
    posMeaningEl.innerHTML   = `<span class="pos">${w.partOfSpeech}</span> ${w.meaning}`;
    exampleEl.textContent    = w.example;
    updateProgress(i);
    updateDots(i);
  }

  function updateProgress(i) {
    progressText.textContent = `${i + 1} / ${words.length}`;
  }

  function updateDots(active) {
    let html = '';
    for (let i = 0; i < words.length; i++) {
      html += `<span class="dot${i === active ? ' active' : ''}"></span>`;
    }
    dotsEl.innerHTML = html;
  }

  // ── TTS ──
  function speak(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.9;
    window.speechSynthesis.speak(u);
  }

  // ── Navigation (with slide animation) ──
  function goTo(next, direction) {
    // direction: 1 = next (left slide), -1 = prev (right slide)
    if (animating.value) return;
    if (next < 0 || next >= words.length) return;
    if (next === index.current) return;

    animating.value = true;

    const outClass  = direction === 1 ? 'slide-out-left' : 'slide-out-right';
    const inClass   = direction === 1 ? 'slide-in-from-right' : 'slide-in-from-left';

    // 1) slide out
    card.classList.add(outClass);

    const onOutEnd = () => {
      card.removeEventListener('transitionend', onOutEnd);

      // 2) update data
      index.current = next;
      renderCard(next);

      // 3) reset position to incoming side
      card.classList.remove(outClass);
      card.style.transition = 'none';
      if (direction === 1) {
        card.style.transform = 'translateX(100%) scale(0.85)';
        card.style.opacity = '0';
      } else {
        card.style.transform = 'translateX(-100%) scale(0.85)';
        card.style.opacity = '0';
      }

      // force reflow
      card.offsetHeight;

      // 4) slide in
      card.style.transition = '';
      card.classList.add(inClass);
      card.style.transform = '';
      card.style.opacity = '';

      const onInEnd = () => {
        card.removeEventListener('transitionend', onInEnd);
        card.classList.remove(inClass);
        animating.value = false;
      };
      card.addEventListener('transitionend', onInEnd);
    };
    card.addEventListener('transitionend', onOutEnd);
  }

  function nextCard() {
    const next = index.current + 1;
    if (next >= words.length) return;
    goTo(next, 1);
  }

  function prevCard() {
    const prev = index.current - 1;
    if (prev < 0) return;
    goTo(prev, -1);
  }

  // ── Swipe ──
  let touchStartX = 0;
  let touchStartY = 0;
  let swiping = false;

  cardWrapper.addEventListener('touchstart', function(e) {
    if (animating.value) return;
    const t = e.changedTouches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    swiping = true;
  }, { passive: true });

  cardWrapper.addEventListener('touchend', function(e) {
    if (!swiping || animating.value) return;
    swiping = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      if (dx > 0) prevCard();
      else nextCard();
    }
  }, { passive: true });

  // ── Keyboard ──
  document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowRight') { e.preventDefault(); nextCard(); }
    if (e.key === 'ArrowLeft')  { e.preventDefault(); prevCard(); }
  });

  // ── Speaker button ──
  speakerBtn.addEventListener('click', function() {
    const w = words[index.current];
    if (w) speak(w.word);
  });

  // ── Nav buttons ──
  prevBtn.addEventListener('click', prevCard);
  nextBtn.addEventListener('click', nextCard);

  // ── Init ──
  if (words && words.length > 0) {
    renderCard(0);
  }
})();
</script>
</body>
</html>
