<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>英文單字學習卡</title>
  <script src="vocab.js"></script>
  <script src="vocab2.js"></script>
  <script src="vocab3.js"></script>
  <script src="vocab4.js"></script>
  <script src="vocab5.js"></script>
  <script src="vocab6.js"></script>
  <script src="vocab7.js"></script>
  <script src="vocab8.js"></script>
  <script src="vocab9.js"></script>
  <script src="vocab10.js"></script>
  <script src="vocab11.js"></script>
  <script src="vocab12.js"></script>
  <script src="vocab13.js"></script>
  <script src="vocab14.js"></script>
  <script src="vocab15.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, 'Helvetica Neue', 'Noto Sans TC', sans-serif;
    background:
      radial-gradient(circle at 20% 20%, hsl(270 60% 20%) 0%, transparent 45%),
      radial-gradient(circle at 80% 30%, hsl(340 60% 35%) 0%, transparent 40%),
      radial-gradient(circle at 50% 95%, hsl(190 60% 30%) 0%, transparent 45%),
      linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    min-height: 100dvh;
    display: flex; justify-content: center; align-items: center;
    overflow: hidden; touch-action: pan-y;
  }
  .container {
    width: 100%; max-width: 420px; padding: 12px 14px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }

  /* ── Page tabs ── */
  .tabs {
    display: flex; gap: 6px; width: 100%;
    justify-content: center; flex-wrap: wrap;
  }
  .tab {
    flex: 0 0 auto; min-width: 34px; padding: 7px 10px;
    border: none; border-radius: 12px;
    font-size: 0.95rem; font-weight: 700; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, hsl(var(--hue) 65% 50% / .55), hsl(calc(var(--hue) + 40) 65% 42% / .55));
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
  }
  .tab:hover { transform: translateY(-2px); }
  .tab.active {
    transform: translateY(-3px);
    box-shadow: 0 8px 22px hsl(var(--hue) 70% 40% / .6);
    background: linear-gradient(135deg, hsl(var(--hue) 75% 55%), hsl(calc(var(--hue) + 40) 72% 45%));
  }

  /* ── 9:16 Card ── */
  .card-wrapper {
    width: 100%; max-height: 68dvh; aspect-ratio: 9 / 16;
    position: relative; overflow: hidden; border-radius: 22px;
    box-shadow: 0 10px 44px rgba(0,0,0,.55);
    perspective: 1200px; touch-action: none; user-select: none;
  }
  .card {
    width: 100%; height: 100%; padding: 26px 22px 18px;
    display: flex; flex-direction: column;
    background: linear-gradient(145deg,
      hsl(var(--hue) 60% 96%) 0%, hsl(calc(var(--hue) + 30) 55% 94%) 100%);
    transition: none; position: relative;
  }
  .card.slide-out-left  { transition: transform .4s cubic-bezier(.55,0,.1,1), opacity .4s ease; transform: translateX(-120%) scale(.85); opacity: 0; }
  .card.slide-out-right { transition: transform .4s cubic-bezier(.55,0,.1,1), opacity .4s ease; transform: translateX(120%) scale(.85); opacity: 0; }
  .card.slide-in-from-left, .card.slide-in-from-right { transition: transform .4s cubic-bezier(.55,0,.1,1), opacity .4s ease; transform: translateX(0) scale(1); opacity: 1; }

  .card-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .card-word {
    font-size: 2.8rem; font-weight: 700; line-height: 1.25; letter-spacing: .02em;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    background-image: linear-gradient(135deg, hsl(var(--hue) 70% 45%), hsl(calc(var(--hue) + 45) 72% 50%));
  }
  .card-phonetic { font-size: 1.1rem; color: hsl(var(--hue) 15% 45%); margin-top: 8px; font-family: 'Times New Roman', serif; }
  .card-divider { width: 48px; height: 2px; margin: 16px 0; border-radius: 2px;
    background: linear-gradient(90deg, hsl(var(--hue) 70% 50%), hsl(calc(var(--hue) + 45) 72% 55%)); }
  .card-pos-meaning { font-size: 1.25rem; color: #333; line-height: 1.5; }
  .card-pos-meaning .pos { color: hsl(var(--hue) 20% 50%); font-weight: 500; }
  .card-example { margin-top: 18px; font-size: 1rem; font-style: italic; color: #5a5a78; line-height: 1.5; max-width: 92%; }
  .card-example::before { content: "\201C"; color: hsl(var(--hue) 60% 55%); }
  .card-example::after { content: "\201D"; color: hsl(var(--hue) 60% 55%); }
  .card-speaker { align-self: flex-end; margin-top: auto; background: none; border: none; font-size: 1.9rem; cursor: pointer; padding: 8px 12px; border-radius: 50%; line-height: 1; transition: background .2s, transform .2s; }
  .card-speaker:hover, .card-speaker:active { background: hsl(var(--hue) 50% 90%); transform: scale(1.15); }

  .nav-row { display: flex; align-items: center; gap: 20px; width: 100%; justify-content: center; }
  .nav-btn { background: rgba(255,255,255,.12); border: none; color: #fff; font-size: 1.5rem; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; backdrop-filter: blur(4px); transition: background .2s, transform .15s; }
  .nav-btn:hover { background: rgba(255,255,255,.22); }
  .nav-btn:active { transform: scale(.92); }

  .progress-text { color: rgba(255,255,255,.8); font-size: .9rem; letter-spacing: .04em; font-weight: 600; }
  .progress-text .page-tag { color: hsl(calc(var(--hue) ) 80% 70%); margin-right: 6px; font-weight: 700; }

  .dots { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; max-width: 100%; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.25); transition: background .3s, transform .3s, width .3s; }
  .dot.active { width: 13px; border-radius: 7px; background: #fff; transform: scale(1.05); }
</style>
</head>
<body>

<div class="container">
  <div class="tabs" id="tabs">
    <button class="tab active" data-page="0" style="--hue:0">1</button>
    <button class="tab" data-page="1" style="--hue:24">2</button>
    <button class="tab" data-page="2" style="--hue:48">3</button>
    <button class="tab" data-page="3" style="--hue:72">4</button>
    <button class="tab" data-page="4" style="--hue:96">5</button>
    <button class="tab" data-page="5" style="--hue:120">6</button>
    <button class="tab" data-page="6" style="--hue:144">7</button>
    <button class="tab" data-page="7" style="--hue:168">8</button>
    <button class="tab" data-page="8" style="--hue:192">9</button>
    <button class="tab" data-page="9" style="--hue:216">10</button>
    <button class="tab" data-page="10" style="--hue:240">11</button>
    <button class="tab" data-page="11" style="--hue:264">12</button>
    <button class="tab" data-page="12" style="--hue:288">13</button>
    <button class="tab" data-page="13" style="--hue:312">14</button>
    <button class="tab" data-page="14" style="--hue:336">15</button>
  </div>

  <div class="card-wrapper" id="cardWrapper" data-page="0" style="--hue:0">
    <div class="card" id="card">
      <div class="card-content" id="cardContent">
        <div class="card-word" id="wordEl"></div>
        <div class="card-phonetic" id="phoneticEl"></div>
        <div class="card-divider"></div>
        <div class="card-pos-meaning" id="posMeaningEl"></div>
        <div class="card-example" id="exampleEl"></div>
        <button class="card-speaker" id="speakerBtn" aria-label="播放發音">🔊</button>
      </div>
    </div>
  </div>

  <div class="progress-text" id="progressText"></div>
  <div class="dots" id="dots"></div>
  <div class="nav-row">
    <button class="nav-btn" id="prevBtn" aria-label="上一個單字">◀</button>
    <button class="nav-btn" id="nextBtn" aria-label="下一個單字">▶</button>
  </div>
</div>

<script>
(function() {
  'use strict';

  const PAGES = [
    { name: 'P.1', data: words },
    { name: 'P.2', data: words2 },
    { name: 'P.3', data: words3 },
    { name: 'P.4', data: words4 },
    { name: 'P.5', data: words5 },
    { name: 'P.6', data: words6 },
    { name: 'P.7', data: words7 },
    { name: 'P.8', data: words8 },
    { name: 'P.9', data: words9 },
    { name: 'P.10', data: words10 },
    { name: 'P.11', data: words11 },
    { name: 'P.12', data: words12 },
    { name: 'P.13', data: words13 },
    { name: 'P.14', data: words14 },
    { name: 'P.15', data: words15 }
  ];

  const pageIdx = { current: 0 };
  const index = { current: 0 };
  const animating = { value: false };
  const card = document.getElementById('card');
  const cardWrapper = document.getElementById('cardWrapper');

  const wordEl = document.getElementById('wordEl');
  const phoneticEl = document.getElementById('phoneticEl');
  const posMeaningEl = document.getElementById('posMeaningEl');
  const exampleEl = document.getElementById('exampleEl');
  const speakerBtn = document.getElementById('speakerBtn');
  const progressText = document.getElementById('progressText');
  const dotsEl = document.getElementById('dots');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const tabsEl = document.getElementById('tabs');

  function curWords() { return PAGES[pageIdx.current].data; }

  function renderCard(i) {
    const w = curWords()[i]; if (!w) return;
    wordEl.textContent = w.word;
    phoneticEl.textContent = w.phonetic;
    posMeaningEl.innerHTML = '<span class="pos">' + w.partOfSpeech + '</span> ' + w.meaning;
    exampleEl.textContent = w.example;
    updateProgress(i); updateDots(i);
  }
  function updateProgress(i) {
    const list = curWords();
    progressText.style.setProperty('--hue', String(pageIdx.current * 24));
    progressText.innerHTML = '<span class="page-tag">' + PAGES[pageIdx.current].name + '</span>' + (i + 1) + ' / ' + list.length;
  }
  function updateDots(active) {
    const list = curWords(); let html = '';
    for (let i = 0; i < list.length; i++) html += '<span class="dot' + (i === active ? ' active' : '') + '"></span>';
    dotsEl.innerHTML = html;
  }
  function updateTabs() {
    const h = String(pageIdx.current * 24);
    cardWrapper.style.setProperty('--hue', h);
    [...tabsEl.children].forEach(function(btn) {
      const on = Number(btn.dataset.page) === pageIdx.current;
      btn.classList.toggle('active', on);
    });
  }
  function switchPage(p) {
    if (p === pageIdx.current || p < 0 || p >= PAGES.length) return;
    pageIdx.current = p; index.current = 0;
    updateTabs(); renderCard(0);
  }
  tabsEl.addEventListener('click', function(e) {
    const btn = e.target.closest('.tab'); if (!btn) return;
    switchPage(Number(btn.dataset.page));
  });

  async function speak(text) {
    if (!text) return;
    try {
      const r1 = await fetch('https://freetts.org/api/tts', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ text, voice:'en-US-JennyNeural', rate:'+0%', pitch:'+0Hz' }) });
      const j = await r1.json();
      if (j && j.file_id) {
        const r2 = await fetch('https://freetts.org/api/audio/' + j.file_id);
        const blob = await r2.blob(); const url = URL.createObjectURL(blob);
        const a = new Audio(url); a.onended = function(){ URL.revokeObjectURL(url); }; await a.play(); return;
      }
    } catch (_) {}
    try {
      const r = await fetch('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=' + encodeURIComponent(text));
      const blob = await r.blob(); const url = URL.createObjectURL(blob);
      const a = new Audio(url); a.onended = function(){ URL.revokeObjectURL(url); }; await a.play(); return;
    } catch (_) {}
    if (window.speechSynthesis) { window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=0.9; window.speechSynthesis.speak(u); }
  }

  function goTo(next, direction) {
    if (animating.value) return;
    const list = curWords();
    if (next < 0 || next >= list.length || next === index.current) return;
    animating.value = true;
    const outClass = direction === 1 ? 'slide-out-left' : 'slide-out-right';
    const inClass = direction === 1 ? 'slide-in-from-right' : 'slide-in-from-left';
    card.classList.add(outClass);
    const onOutEnd = function() {
      card.removeEventListener('transitionend', onOutEnd);
      index.current = next; renderCard(next);
      card.classList.remove(outClass); card.style.transition = 'none';
      card.style.transform = direction === 1 ? 'translateX(100%) scale(.85)' : 'translateX(-100%) scale(.85)';
      card.style.opacity = '0'; card.offsetHeight;
      card.style.transition = ''; card.classList.add(inClass);
      card.style.transform = ''; card.style.opacity = '';
      const onInEnd = function() { card.removeEventListener('transitionend', onInEnd); card.classList.remove(inClass); animating.value = false; };
      card.addEventListener('transitionend', onInEnd);
    };
    card.addEventListener('transitionend', onOutEnd);
  }
  function nextCard() { const n = index.current + 1; if (n < curWords().length) goTo(n, 1); }
  function prevCard() { const p = index.current - 1; if (p >= 0) goTo(p, -1); }

  let touchStartX = 0, touchStartY = 0, swiping = false;
  cardWrapper.addEventListener('touchstart', function(e) {
    if (animating.value) return; const t = e.changedTouches[0]; touchStartX = t.clientX; touchStartY = t.clientY; swiping = true;
  }, { passive: true });
  cardWrapper.addEventListener('touchend', function(e) {
    if (!swiping || animating.value) return; swiping = false;
    const t = e.changedTouches[0]; const dx = t.clientX - touchStartX; const dy = t.clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) { if (dx > 0) prevCard(); else nextCard(); }
  }, { passive: true });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowRight') { e.preventDefault(); nextCard(); }
    if (e.key === 'ArrowLeft')  { e.preventDefault(); prevCard(); }
    if (e.key >= '1' && e.key <= '9') { const p = Number(e.key) - 1; if (p < PAGES.length) switchPage(p); }
  });

  speakerBtn.addEventListener('click', function() { const w = curWords()[index.current]; if (w) speak(w.word); });
  prevBtn.addEventListener('click', prevCard);
  nextBtn.addEventListener('click', nextCard);

  updateTabs();
  const initList = curWords();
  if (initList && initList.length > 0) renderCard(0);
})();
</script>
</body>
</html>
