<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>jesus_genealogy_key_figures_cuv.svg</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; font-family: sans-serif; background: #fff; }
  #bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; gap: 8px; align-items: center; padding: 8px 12px;
    background: #f4f4f4; border-bottom: 1px solid #ccc; flex-wrap: wrap;
  }
  #bar button { font-size: 18px; width: 36px; height: 32px; cursor: pointer; }
  #zoomLabel { min-width: 60px; text-align: center; font-size: 14px; }
  #q { height: 32px; font-size: 15px; padding: 0 8px; width: 160px; }
  #qcount { font-size: 14px; min-width: 56px; text-align: center; color: #333; }
  #view { position: fixed; inset: 49px 0 0 0; overflow: hidden; touch-action: none; cursor: grab; }
  #view.drag { cursor: grabbing; }
  #stage { transform-origin: 0 0; }
  #stage svg { display: block; max-width: none; }
  /* mermaid 低估 CJK <br/> 兩行高度, 第二行被 foreignObject 裁掉: 強制可見 */
  #stage foreignObject { overflow: visible !important; }
  #stage g.node div { overflow: visible !important; height: auto !important; }
  /* search highlight: whole node + label bg */
  #stage g.node.found rect.label-container { stroke: #e00; stroke-width: 3px; }
  #stage g.node.found div { background: #ffeb3b; }
  #stage g.node.current rect.label-container { stroke: #e00; stroke-width: 5px; }
  #stage g.node.current div { background: #ffb300; }
  #stage .edgeLabel.found div { background: #ffeb3b; outline: 2px solid #e00; }
  #stage .edgeLabel.current div { background: #ffb300; outline: 3px solid #e00; }
  #legendBtn { width: auto; }
  #legendPanel {
    position: fixed; top: 49px; right: 0; bottom: 0; width: 300px; z-index: 9;
    background: #fff; border-left: 1px solid #ccc; padding: 12px;
    overflow-y: auto; display: none; font-size: 14px;
  }
  #legendPanel.open { display: block; }
  #legendPanel h3 { font-size: 16px; margin-bottom: 8px; }
  #legendPanel h4 { font-size: 14px; margin: 10px 0 4px; color: #555; }
  #legendPanel .leg-item { padding: 6px 8px; border-bottom: 1px solid #eee; cursor: pointer; }
  #legendPanel .leg-item:hover { background: #fff9c4; }
  #printIndex { display: none; }
  /* 列印/PDF: 隱藏工具列, SVG 縮放至頁寬, 文字索引接在圖後 (PDF 內可搜尋) */
  @media print {
    html, body { overflow: visible; height: auto; background: #fff; }
    #bar, #legendPanel { display: none !important; }
    #view { position: static; overflow: visible; }
    #stage { transform: none !important; }
    #stage svg { width: 100% !important; height: auto !important; }
    #printIndex { display: block; font-size: 11px; line-height: 1.5; }
    #printIndex h2 { font-size: 16px; margin: 0 0 8px; page-break-before: always; }
    #printIndex h4 { font-size: 13px; margin: 12px 0 4px; color: #444; }
    #printIndex .pi-item { padding: 1px 0; border-bottom: 1px dotted #ddd; break-inside: avoid; }
  }
</style>
</head>
<body>
<div id="bar">
  <button id="zin" title="放大">+</button>
  <button id="zout" title="縮小">−</button>
  <button id="zreset" title="重設 1:1" style="width:auto">1:1</button>
  <button id="zfit" title="適應視窗" style="width:auto">⤢</button>
  <button id="legendBtn" title="圖例">圖例</button>
  <button id="pdfBtn" title="列印 / 存 PDF" style="width:auto">🖨</button>
  <span id="zoomLabel">100%</span>
  <input id="q" type="search" placeholder="搜尋關鍵字…" />
  <button id="qprev" title="上一個">‹</button>
  <button id="qnext" title="下一個">›</button>
  <button id="qclear" title="清除" style="width:auto">✕</button>
  <span id="qcount"></span>
</div>
<div id="view"><div id="stage">載入中…</div></div>
<aside id="legendPanel">
  <h3>圖例 <span id="legendCount"></span></h3>
  <div id="legendList">載入中…</div>
</aside>
<div id="printIndex"></div>
<script>
(function () {
  var view = document.getElementById('view');
  var stage = document.getElementById('stage');
  var label = document.getElementById('zoomLabel');
  var s = 1, tx = 0, ty = 0;
  var MIN = 0.05, MAX = 20;
  function apply() {
    stage.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + s + ')';
    label.textContent = Math.round(s * 100) + '%';
  }
  function zoomAt(cx, cy, f) {
    var ns = Math.min(MAX, Math.max(MIN, s * f));
    tx = cx - (cx - tx) * (ns / s);
    ty = cy - (cy - ty) * (ns / s);
    s = ns;
    apply();
  }
  function fit() {
    var svg = stage.querySelector('svg');
    var r = view.getBoundingClientRect();
    if (!svg || !svg.viewBox || !svg.viewBox.baseVal || !svg.viewBox.baseVal.width) {
      var img = stage.querySelector('img');
      if (img && img.naturalWidth) s = Math.min(r.width / img.naturalWidth, 1);
      else return;
    } else {
      var vb = svg.viewBox.baseVal;
      s = Math.min(r.width / vb.width, r.height / vb.height);
      s = Math.min(Math.max(s, MIN), 1);
    }
    tx = 0; ty = 0;
    apply();
  }
  document.getElementById('zin').onclick = function () {
    var r = view.getBoundingClientRect();
    zoomAt(r.width / 2, r.height / 2, 1.25);
  };
  document.getElementById('zout').onclick = function () {
    var r = view.getBoundingClientRect();
    zoomAt(r.width / 2, r.height / 2, 0.8);
  };
  document.getElementById('zreset').onclick = function () { s = 1; tx = 0; ty = 0; apply(); };
  document.getElementById('zfit').onclick = fit;
  document.getElementById('legendBtn').onclick = function () {
    document.getElementById('legendPanel').classList.toggle('open');
  };
  view.addEventListener('wheel', function (e) {
    e.preventDefault();
    var r = view.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.15 : 1 / 1.15);
  }, { passive: false });
  var drag = null;
  view.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    drag = { x: e.clientX - tx, y: e.clientY - ty };
    view.classList.add('drag');
    view.setPointerCapture(e.pointerId);
  });
  view.addEventListener('pointermove', function (e) {
    if (!drag) return;
    tx = e.clientX - drag.x;
    ty = e.clientY - drag.y;
    apply();
  });
  function endDrag() { drag = null; view.classList.remove('drag'); }
  view.addEventListener('pointerup', endDrag);
  view.addEventListener('pointercancel', endDrag);
  // 雙指 pinch
  var pinch = 0;
  view.addEventListener('touchmove', function (e) {
    if (e.touches.length !== 2) return;
    e.preventDefault();
    var d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY);
    if (pinch > 0) {
      var r = view.getBoundingClientRect();
      var mx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left;
      var my = (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top;
      zoomAt(mx, my, d / pinch);
    }
    pinch = d;
  }, { passive: false });
  view.addEventListener('touchend', function () { pinch = 0; });

  // ---- search (needs inline SVG: <img> content is opaque to JS) ----
  var q = document.getElementById('q');
  var qcount = document.getElementById('qcount');
  var nodes = [], hits = [], idx = 0;
  var legendItems = [];
  function clearMark() {
    stage.querySelectorAll('.found,.current').forEach(function (el) {
      el.classList.remove('found'); el.classList.remove('current');
    });
    hits = []; idx = 0; qcount.textContent = '';
  }
  function centerOn(el) {
    var r = el.getBoundingClientRect(), vr = view.getBoundingClientRect();
    if (!r.width && !r.height) return;
    tx += (vr.left + vr.width / 2) - (r.left + r.width / 2);
    ty += (vr.top + vr.height / 2) - (r.top + r.height / 2);
    apply();
  }
  function gotoHit(i) {
    if (!hits.length) return;
    idx = (i + hits.length) % hits.length;
    stage.querySelectorAll('.current').forEach(function (el) { el.classList.remove('current'); });
    hits[idx].classList.add('current');
    centerOn(hits[idx]);
    qcount.textContent = (idx + 1) + '/' + hits.length;
  }
  function doSearch() {
    var kw = q.value.trim().toLowerCase();
    clearMark();
    if (!kw) return;
    var seen = [];
    hits = nodes.filter(function (el) {
      var t = (el.textContent || '').toLowerCase();
      if (t.indexOf(kw) !== -1) { seen.push(el); return true; }
      return false;
    });
    legendItems.forEach(function (it) {
      if (!it.el) return;
      var key = (it.name + ' ' + it.note).toLowerCase();
      if (key.indexOf(kw) !== -1 && seen.indexOf(it.el) === -1) {
        seen.push(it.el);
        hits.push(it.el);
      }
    });
    if (!hits.length) { qcount.textContent = '0 件'; return; }
    hits.forEach(function (el) { el.classList.add('found'); });
    gotoHit(0);
  }
  var deb = null;
  q.addEventListener('input', function () { clearTimeout(deb); deb = setTimeout(doSearch, 200); });
  q.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); if (hits.length) gotoHit(idx + 1); else doSearch(); }
  });
  document.getElementById('qnext').onclick = function () { gotoHit(idx + 1); };
  document.getElementById('qprev').onclick = function () { gotoHit(idx - 1); };
  document.getElementById('qclear').onclick = function () { q.value = ''; clearMark(); q.focus(); };
  // 靜態圖例 (SVG 內 85 條 <br/> 第二行說明): file:// 無法 fetch 時照樣顯示
  var LEGEND_STATIC = [{"name":"亞伯","note":"無後"},{"name":"夏娃","note":"第一個女人"},{"name":"以諾城","note":"第一座城"},{"name":"拿瑪","note":"女兒"},{"name":"西頓","note":"長子"},{"name":"尼拜約","note":"長子"},{"name":"以掃","note":"長子"},{"name":"掃羅","note":"第一位君王"},{"name":"底拿","note":"女兒"},{"name":"約沙","note":"亞瑪謝之子"},{"name":"耶戶","note":"約示比之子"},{"name":"細撒","note":"示非之子"},{"name":"細布業","note":"長子"},{"name":"米利暗","note":"女兒"},{"name":"撒母耳","note":"先知、士師"},{"name":"約珥","note":"長子"},{"name":"亞比亞","note":"次子"},{"name":"以利亞","note":"先知"},{"name":"以利沙","note":"先知；沙法之子"},{"name":"拿單","note":"先知；大衛宮廷"},{"name":"迦得","note":"先見；大衛宮廷"},{"name":"亞希雅","note":"示羅先知"},{"name":"耶利米","note":"祭司希勒家之子；大先知"},{"name":"以西結","note":"祭司布西之子；大先知"},{"name":"以賽亞","note":"大先知；亞摩斯之子"},{"name":"但以理","note":"大先知"},{"name":"以斯拉","note":"祭司、文士；撒萊雅之子"},{"name":"尼希米","note":"省長；哈迦利亞之子"},{"name":"何西阿","note":"備利之子"},{"name":"約珥","note":"毗土珥之子"},{"name":"阿摩司","note":"提哥亞牧人"},{"name":"俄巴底亞","note":"先知"},{"name":"約拿","note":"亞米太之子"},{"name":"彌迦","note":"摩利沙人"},{"name":"那鴻","note":"伊勒歌斯人"},{"name":"哈巴谷","note":"先知"},{"name":"西番雅","note":"希西家玄孫；古示之子"},{"name":"哈該","note":"先知"},{"name":"撒迦利亞","note":"比利家之子"},{"name":"瑪拉基","note":"先知"},{"name":"約書亞／何西阿","note":"嫩的兒子；摩西改名"},{"name":"基甸","note":"士師"},{"name":"參孫","note":"拿細耳人；士師"},{"name":"他瑪","note":"女兒"},{"name":"拔示巴","note":"所羅門之母"},{"name":"所羅門","note":"馬太線"},{"name":"拿單","note":"路加線"},{"name":"雅比斯","note":"禱告蒙應允"},{"name":"哈悉勒玻尼","note":"女兒"},{"name":"毗努伊勒","note":"基多之祖"},{"name":"以謝珥","note":"戶沙之祖"},{"name":"亞施戶","note":"提哥亞之祖"},{"name":"基綠","note":"書哈之弟兄"},{"name":"提欣拿","note":"珥拿轄之祖"},{"name":"約押","note":"革夏納欣人之祖"},{"name":"比提雅","note":"法老女兒"},{"name":"米利暗","note":"女兒"},{"name":"益巴","note":"以實提摩之祖"},{"name":"雅列","note":"基多之祖"},{"name":"希伯","note":"梭哥之祖"},{"name":"耶古鐵","note":"撒挪亞之祖"},{"name":"基伊拉","note":"迦米人"},{"name":"以實提摩","note":"瑪迦人"},{"name":"珥","note":"利迦之祖"},{"name":"拉大","note":"瑪利沙之祖"},{"name":"亞實比族","note":"織細麻布"},{"name":"耶哥尼雅","note":"被擄"},{"name":"約瑟","note":"馬利亞的丈夫"},{"name":"洗魯雅","note":"大衛的姊妹"},{"name":"約押","note":"大衛軍隊元帥"},{"name":"亞比篩","note":"勇士統領"},{"name":"亞撒黑","note":"勇士"},{"name":"雅朔班","note":"三勇士之首"},{"name":"以利亞撒","note":"三勇士"},{"name":"沙瑪","note":"三勇士"},{"name":"比拿雅","note":"三十勇士首領"},{"name":"底波拉","note":"第一位女士師；先知"},{"name":"撒迦利亞","note":"祭司"},{"name":"施洗約翰","note":"第一位施洗者"},{"name":"司提反","note":"第一位殉道者"},{"name":"哥尼流及其家人","note":"第一批外邦歸信者"},{"name":"保羅","note":"外邦人的使徒"},{"name":"亞拿","note":"女先知"},{"name":"抹大拉的馬利亞","note":"第一位見證復活"},{"name":"麥基洗德","note":"祭司王預表基督"}];
  // ---- legend: 節點第二行說明集中在此, 點擊定位到該人名 ----
  function buildLegend(items) {
    legendItems = items;
    var list = document.getElementById('legendList');
    list.innerHTML = '';
    function group(title, arr) {
      if (!arr.length) return;
      var h = document.createElement('h4');
      h.textContent = title + ' (' + arr.length + ')';
      list.appendChild(h);
      arr.forEach(function (it) {
        var d = document.createElement('div');
        d.className = 'leg-item';
        d.textContent = it.name + ' — ' + it.note;
        d.title = '定位到 ' + it.name;
        d.onclick = function () {
          q.value = it.name;
          doSearch();
          if (window.innerWidth < 700) document.getElementById('legendPanel').classList.remove('open');
        };
        list.appendChild(d);
      });
    }
    group('第一', items.filter(function (it) { return it.note.indexOf('第一') !== -1; }));
    group('其他說明', items.filter(function (it) { return it.note.indexOf('第一') === -1; }));
    document.getElementById('legendCount').textContent = items.length ? items.length + ' 項' : '';
  }
  buildLegend(LEGEND_STATIC.map(function (it) { return { name: it.name, note: it.note, el: null }; }));
  // ---- 列印/PDF 文字索引: LEGEND_STATIC 轉為可搜尋文字, 接在 SVG 後 ----
  var pi = document.getElementById('printIndex');
  var piFirst = LEGEND_STATIC.filter(function (it) { return it.note.indexOf('第一') !== -1; });
  var piOther = LEGEND_STATIC.filter(function (it) { return it.note.indexOf('第一') === -1; });
  var piH = document.createElement('h2');
  piH.textContent = '耶穌家譜關鍵人物 — 文字索引 (' + LEGEND_STATIC.length + ' 項)';
  pi.appendChild(piH);
  function piGroup(title, arr) {
    var h = document.createElement('h4');
    h.textContent = title + ' (' + arr.length + ')';
    pi.appendChild(h);
    arr.forEach(function (it) {
      var d = document.createElement('div');
      d.className = 'pi-item';
      d.textContent = it.name + ' — ' + it.note;
      pi.appendChild(d);
    });
  }
  piGroup('第一', piFirst);
  piGroup('其他說明', piOther);
  document.getElementById('pdfBtn').onclick = function () { window.print(); };

  // ---- load svg inline so its text is searchable ----
  fetch('jesus_genealogy_key_figures_cuv.svg').then(function (res) {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.text();
  }).then(function (svgText) {
    stage.innerHTML = svgText;
    // 族譜節點只留名: <br/> 後第二行說明抽出 → 圖例面板, 節點縮回單行尺寸
    var legend = [];
    stage.querySelectorAll('g.node').forEach(function (gn) {
      var p = gn.querySelector('p');
      var br = p && p.querySelector('br');
      if (!p || !br) return;
      var nm = '', note = '', c = p.firstChild;
      while (c && c !== br) { nm += c.textContent || ''; c = c.nextSibling; }
      var n = br.nextSibling;
      while (n) { note += n.textContent || ''; n = n.nextSibling; }
      while (br.nextSibling) p.removeChild(br.nextSibling);
      p.removeChild(br);
      if (note.trim()) legend.push({ name: nm.trim(), note: note.trim(), el: gn });
      var rc = gn.querySelector('rect.label-container');
      var fo = gn.querySelector('foreignObject');
      var lb = gn.querySelector('g.label');
      if (rc) { rc.setAttribute('width', '152'); rc.setAttribute('height', '45'); rc.setAttribute('x', '-76'); rc.setAttribute('y', '-22.5'); }
      if (fo) { fo.setAttribute('width', '120'); fo.setAttribute('height', '21'); }
      if (lb) lb.setAttribute('transform', 'translate(-60, -10.5)');
    });
    buildLegend(legend);
    var svg = stage.querySelector('svg');
    if (svg) {
      // fixed pixel size so 1:1 = full resolution, pan/zoom via #stage
      var vb = svg.viewBox && svg.viewBox.baseVal;
      if (vb && vb.width) { svg.style.width = vb.width + 'px'; svg.style.height = vb.height + 'px'; }
      svg.removeAttribute('width');
    }
    nodes = Array.prototype.slice.call(stage.querySelectorAll('g.node, g.edgeLabel'));
    fit();
    doSearch();
  }).catch(function (err) {
    // file:// 下 fetch 被擋時降級為 <img> (可看圖, 無搜尋)
    stage.innerHTML = '<img id="imgFallback" src="jesus_genealogy_key_figures_cuv.svg" alt="diagram" draggable="false" style="display:block;max-width:none" />';
    qcount.textContent = '搜尋需 http 模式';
    q.disabled = true;
    fit();
  });
  apply();
})();
</script>
</body>
</html>
