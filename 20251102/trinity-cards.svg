<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 定義漸層 -->
  <defs>
    <!-- 藍色漸層 - 定睛耶穌 -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    
    <!-- 綠色漸層 - 放手交託 -->
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14532d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#86efac;stop-opacity:1" />
    </linearGradient>
    
    <!-- 紅色漸層 - 全然為你 -->
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7f1d1d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fca5a5;stop-opacity:1" />
    </linearGradient>
    
    <!-- 陰影效果 -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8fafc"/>
  
  <!-- 卡片1: 定睛耶穌 (上方) -->
  <g transform="translate(400, 120)">
    <rect x="-160" y="-80" width="320" height="160" rx="12" ry="12"
          fill="url(#blueGradient)" filter="url(#shadow)" opacity="0.9"/>
    <text x="0" y="-50" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">
      定睛耶穌
    </text>
    <text x="0" y="-30" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="13">
      Focus on Jesus
    </text>
    <text x="0" y="-10" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-style="italic">
      「仰望為我們信心創始成終的耶穌。」
    </text>
    <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      ——希伯來書12章2節
    </text>
    <text x="0" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      將個人信心、思想和盼望的焦點，
    </text>
    <text x="0" y="38" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      從自我、他人或環境，轉移並持續地
    </text>
    <text x="0" y="51" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      安放在耶穌基督身上
    </text>
    <text x="0" y="68" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">
      意識轉換 → 焦點重置 → 拒絕比較
    </text>
  </g>
  
  <!-- 卡片2: 放手交託 (中間) -->
  <g transform="translate(400, 300)">
    <rect x="-160" y="-80" width="320" height="160" rx="12" ry="12"
          fill="url(#greenGradient)" filter="url(#shadow)" opacity="0.9"/>
    <text x="0" y="-50" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">
      放手交託
    </text>
    <text x="0" y="-30" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="13">
      Let Go and Entrust
    </text>
    <text x="0" y="-10" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-style="italic">
      「你要把你的重擔卸給耶和華，他必撫養你。」
    </text>
    <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      ——詩篇55章22節
    </text>
    <text x="0" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      將生命中自己緊抓不放的主權、
    </text>
    <text x="0" y="38" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      掌控、驕傲、恐懼和執著，
    </text>
    <text x="0" y="51" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      有意識地交給神
    </text>
    <text x="0" y="68" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">
      識別執著 → 宣告交託 → 停止爭鬥
    </text>
  </g>
  
  <!-- 卡片3: 全然為你 (下方) -->
  <g transform="translate(400, 480)">
    <rect x="-160" y="-80" width="320" height="160" rx="12" ry="12"
          fill="url(#redGradient)" filter="url(#shadow)" opacity="0.9"/>
    <text x="0" y="-50" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">
      全然為你
    </text>
    <text x="0" y="-30" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="13">
      All for You
    </text>
    <text x="0" y="-10" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-style="italic">
      「將身體獻上，當作活祭，是聖潔的，是神所喜悅的。」
    </text>
    <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      ——羅馬書12章1節
    </text>
    <text x="0" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      將生命的全部，包括時間、恩賜、
    </text>
    <text x="0" y="38" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      財富、家庭甚至未來，
    </text>
    <text x="0" y="51" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">
      視為完整祭物獻給神
    </text>
    <text x="0" y="68" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">
      價值重估 → 打破香膏 → 生活即敬拜
    </text>
  </g>
  
  <!-- 連接線 - 垂直排列 -->
  <line x1="400" y1="200" x2="400" y2="220"
        stroke="#94a3b8" stroke-width="3" opacity="0.6"/>
  <line x1="400" y1="380" x2="400" y2="400"
        stroke="#94a3b8" stroke-width="3" opacity="0.6"/>
  
  <!-- 連接箭頭 -->
  <polygon points="395,220 400,230 405,220" fill="#94a3b8" opacity="0.6"/>
  <polygon points="395,400 400,410 405,400" fill="#94a3b8" opacity="0.6"/>
</svg>