<svg width="500" height="1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 中心圓漸層 -->
    <linearGradient id="faithGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    
    <!-- 支柱1漸層 (同在的神) -->
    <linearGradient id="presenceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    
    <!-- 支柱2漸層 (體恤痛苦的神) -->
    <linearGradient id="comfortGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
    
    <!-- 支柱3漸層 (掌管時機的神) -->
    <linearGradient id="timingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    
    <!-- 支柱4漸層 (施行恢復的神) -->
    <linearGradient id="restorationGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b91c1c;stop-opacity:1" />
    </linearGradient>
    
    <!-- 呼吸動畫效果 -->
    <filter id="breatheGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 呼吸動畫 CSS -->
    <style>
      @keyframes faithBreathe {
        0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.3));
        }
        50% {
          transform: scale(1.02);
          filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.6));
        }
      }
      
      @keyframes pillarBreathe {
        0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.4));
        }
        50% {
          transform: scale(1.01);
          filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.7));
        }
      }
      
      .breathe-center {
        animation: faithBreathe 4s ease-in-out infinite;
      }
      
      .breathe-element {
        animation: pillarBreathe 3s ease-in-out infinite;
      }
    </style>
    
    <!-- 陰影效果 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect x="10" y="10" width="480" height="969" rx="15" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  
  <!-- 標題背景 -->
  <rect x="10" y="10" width="480" height="70" rx="15" fill="#f59e0b"/>
  
  <!-- 標題文字 -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
    ✝️ 信仰的四大支柱
  </text>
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white">
    禕倫牧師講道核心論證
  </text>
  
  <!-- 中心圓 -->
  <circle cx="250" cy="160" r="65" fill="url(#faithGradient)" stroke="#e5e7eb" stroke-width="3" filter="url(#shadow)" class="breathe-center"/>
  <text x="250" y="150" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="white">
    🙏 信仰核心
  </text>
  <text x="250" y="170" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">
    四大支柱
  </text>
  
  <!-- 連接線 -->
  <line x1="250" y1="225" x2="250" y2="300" stroke="#fbbf24" stroke-width="3"/>
  <line x1="250" y1="410" x2="250" y2="480" stroke="#fbbf24" stroke-width="3"/>
  <line x1="250" y1="590" x2="250" y2="660" stroke="#fbbf24" stroke-width="3"/>
  <line x1="250" y1="770" x2="250" y2="840" stroke="#fbbf24" stroke-width="3"/>
  
  <!-- 支柱1：神是與我們同在的神 -->
  <rect x="50" y="300" width="400" height="110" rx="10" fill="url(#presenceGradient)" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)" class="breathe-element"/>
  <text x="250" y="320" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    🕊️ I. 神是與我們同在的神
  </text>
  <text x="250" y="345" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#dbeafe">
    祂的同在並非遙遠的教義，而是真實的臨在
  </text>
  <text x="250" y="370" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#bfdbfe">
    如同耶穌看見馬利亞哭，祂也哭了
  </text>
  <text x="250" y="395" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#93c5fd">
    祂進入我們當下的處境，與我們一同感受悲傷
  </text>
  
  <!-- 支柱2：神是體恤我們痛苦的神 -->
  <rect x="50" y="480" width="400" height="110" rx="10" fill="url(#comfortGradient)" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)" class="breathe-element"/>
  <text x="250" y="500" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    💜 II. 神是體恤我們痛苦的神
  </text>
  <text x="250" y="525" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#e9d5ff">
    十字架是最大的安慰
  </text>
  <text x="250" y="550" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#d8b4fe">
    道成肉身的耶穌親身經歷了我們所承受的苦痛
  </text>
  <text x="250" y="575" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#c084fc">
    當我們在苦難中感到孤單時，十字架證明了祂的愛
  </text>
  
  <!-- 支柱3：神是掌管時機的神 -->
  <rect x="50" y="660" width="400" height="110" rx="10" fill="url(#timingGradient)" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)" class="breathe-element"/>
  <text x="250" y="680" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    ⏰ III. 神是掌管時機的神
  </text>
  <text x="250" y="705" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#a7f3d0">
    祂的作為包含了祂完美的「Timing」
  </text>
  <text x="250" y="730" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#6ee7b7">
    我們眼中的「黃金搶救時間」與神所預備的「及時雨」不同
  </text>
  <text x="250" y="755" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#34d399">
    祂看似的延遲，是為了在最完美的時刻帶來生命開花結果
  </text>
  
  <!-- 支柱4：神是施行恢復的神 -->
  <rect x="50" y="840" width="400" height="110" rx="10" fill="url(#restorationGradient)" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)" class="breathe-element"/>
  <text x="250" y="860" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="white">
    🌱 IV. 神是施行恢復的神
  </text>
  <text x="250" y="885" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#fecaca">
    祂的目標是「恢復」而非僅僅是「修復」
  </text>
  <text x="250" y="910" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#fca5a5">
    即使生命景況如同死了四天的拉撒路一樣「臭了」
  </text>
  <text x="250" y="935" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#f87171">
    祂的作為仍要帶我們回到起初被造時最美好的樣式
  </text>
</svg>