<svg width="600" height="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 卡片1漸層 -->
    <linearGradient id="cardGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a5568;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d3748;stop-opacity:1" />
    </linearGradient>
    
    <!-- 卡片2漸層 -->
    <linearGradient id="cardGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c5282;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a365d;stop-opacity:1" />
    </linearGradient>
    
    <!-- 卡片3漸層 -->
    <linearGradient id="cardGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#553c9a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#44337a;stop-opacity:1" />
    </linearGradient>
    
    <!-- 卡片4漸層 -->
    <linearGradient id="cardGradient4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#744210;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#543310;stop-opacity:1" />
    </linearGradient>
    
    <!-- 共用電路漸層 -->
    <linearGradient id="circuitGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#00b3ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:0.8" />
    </linearGradient>
    
    <!-- 呼吸效果濾鏡 -->
    <filter id="breatheGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 電路線條濾鏡 -->
    <filter id="circuitGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 呼吸動畫 -->
    <style>
      @keyframes breathe {
        0%, 100% {
          stroke-width: 2;
          stroke: url(#circuitGradient);
          filter: drop-shadow(0 0 5px rgba(0, 187, 255, 0.6));
          transform: scale(1);
        }
        25% {
          stroke-width: 3;
          stroke: #00ffff;
          filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.8));
          transform: scale(1.005);
        }
        50% {
          stroke-width: 4;
          stroke: #0066ff;
          filter: drop-shadow(0 0 15px rgba(0, 102, 255, 0.9));
          transform: scale(1.01);
        }
        75% {
          stroke-width: 3;
          stroke: #00b3ff;
          filter: drop-shadow(0 0 10px rgba(0, 179, 255, 0.8));
          transform: scale(1.005);
        }
      }
      
      @keyframes circuitPulse {
        0%, 100% {
          stroke-dashoffset: 0;
          stroke-opacity: 0.6;
        }
        50% {
          stroke-dashoffset: -10;
          stroke-opacity: 1;
        }
      }
      
      .breathe-border {
        animation: breathe 3s ease-in-out infinite;
      }
      
      .circuit-line {
        stroke-dasharray: 5 3;
        animation: circuitPulse 2s linear infinite;
      }
    </style>
    
    <!-- 陰影濾鏡 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 卡片1 -->
  <g transform="translate(0, 0)">
    <!-- 背景 -->
    <rect x="10" y="10" width="580" height="280" rx="10" fill="url(#cardGradient1)" filter="url(#shadow)"/>
    <!-- 邊框 -->
    <rect x="10" y="10" width="580" height="280" rx="10" fill="none" stroke="url(#circuitGradient)" stroke-width="2" class="breathe-border"/>
    <!-- 裝飾線條 -->
    <rect x="15" y="15" width="570" height="270" rx="8" fill="none" stroke="url(#circuitGradient)" stroke-width="1" filter="url(#circuitGlow)" class="circuit-line"/>
    <rect x="20" y="20" width="560" height="260" rx="6" fill="none" stroke="rgba(0, 187, 255, 0.3)" stroke-width="0.5" filter="url(#circuitGlow)" class="circuit-line"/>
    <!-- 角落裝飾 -->
    <path d="M10,10 L30,10 L30,30 L10,30 Z" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
    <path d="M570,10 L590,10 L590,30 L570,30 Z" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
    <path d="M10,270 L30,270 L30,290 L10,290 Z" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
    <path d="M570,270 L590,270 L590,290 L570,290 Z" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
    <!-- 標題背景 -->
    <rect x="10" y="10" width="580" height="40" rx="10" fill="#3182ce"/>
    <rect x="10" y="40" width="580" height="10" fill="#3182ce"/>
    <!-- 標題文字 -->
    <text x="300" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">論點卡片 1：避免愚蠢 (Avoiding Stupidity)</text>
    <!-- 內容文字 -->
    <text x="25" y="70" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0">定義：</text>
    <text x="25" y="100" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e0">一種消極的智慧，核心是規避災難性的、普通的錯誤，而非追求卓越的、驚人的成功。這是六十歲後唯一重要的遊戲規則。</text>
    <text x="25" y="150" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0">實踐方法：</text>
    <text x="25" y="170" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e0">- 避免債務、避免與製造麻煩的人為伍、不追逐熱門投資、在能力圈內行事。</text>
    <text x="25" y="220" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0">關鍵引述：</text>
    <text x="25" y="245" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e0">「我致富不是因為我比所有人都聰明，而是因為我成功避開了那些多數人執意要跌進去的陷阱。」</text>
  </g>

  <!-- 卡片2 -->
  <g transform="translate(0, 300)">
    <!-- 背景 -->
    <rect x="10" y="10" width="580" height="280" rx="10" fill="url(#cardGradient2)" filter="url(#shadow)"/>
    <!-- 邊框 -->
    <rect x="10" y="10" width="580" height="280" rx="10" fill="none" stroke="url(#circuitGradient)" stroke-width="2" class="breathe-border"/>
    <!-- 裝飾線條 -->
    <rect x="15" y="15" width="570" height="270" rx="8" fill="none" stroke="url(#circuitGradient)" stroke-width="1" filter="url(#circuitGlow)" class="circuit-line"/>
    <rect x="20" y="20" width="560" height="260" rx="6" fill="none" stroke="rgba(0, 187, 255, 0.3)" stroke-width="0.5" filter="url(#circuitGlow)" class="circuit-line"/>
    <!-- 角落裝飾 -->
    <path d="M10,10 L30,10 L30,30 L10,30 Z" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
    <path d="M570,10 L590,10 L590,30 L570,30 Z" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
    <path d="M10,270 L30,270 L30,290 L10,290 Z" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
    <path d="M570,270 L590,270 L590,290 L570,290 Z" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
    <!-- 標題背景 -->
    <rect x="10" y="10" width="580" height="40" rx="10" fill="#3182ce"/>
    <rect x="10" y="40" width="580" height="10" fill="#3182ce"/>
    <!-- 標題文字 -->
    <text x="300" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">論點卡片 2：主人翁思維 (Ownership Thinking)</text>
    <!-- 內容文字 -->
    <text x="25" y="70" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0">定義：</text>
    <text x="25" y="100" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e0">一種將自己視為決策者與資產擁有者的心態，而非等待指令的員工。衡量標準是現金流與自主權，而非頭銜與地位。</text>
    <text x="25" y="150" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0">實踐方法：</text>
    <text x="25" y="170" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e0">- 擁有自己的房屋、投資組合、時間（更常說「不」）和決策權。問「什麼才有效？」，而不是「我看起來如何？」。</text>
    <text x="25" y="220" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0">關鍵引述：</text>
    <text x="25" y="245" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e0">「讓你獲得自由的是擁有權，而不是職業主義。」</text>
  </g>

  <!-- 卡片3 -->
  <g transform="translate(0, 600)">
    <!-- 背景 -->
    <rect x="10" y="10" width="580" height="280" rx="10" fill="url(#cardGradient3)" filter="url(#shadow)"/>
    <!-- 邊框 -->
    <rect x="10" y="10" width="580" height="280" rx="10" fill="none" stroke="url(#circuitGradient)" stroke-width="2" class="breathe-border"/>
    <!-- 裝飾線條 -->
    <rect x="15" y="15" width="570" height="270" rx="8" fill="none" stroke="url(#circuitGradient)" stroke-width="1" filter="url(#circuitGlow)" class="circuit-line"/>
    <rect x="20" y="20" width="560" height="260" rx="6" fill="none" stroke="rgba(0, 187, 255, 0.3)" stroke-width="0.5" filter="url(#circuitGlow)" class="circuit-line"/>
    <!-- 角落裝飾 -->
    <path d="M10,10 L30,10 L30,30 L10,30 Z" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
    <path d="M570,10 L590,10 L590,30 L570,30 Z" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
    <path d="M10,270 L30,270 L30,290 L10,290 Z" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
    <path d="M570,270 L590,270 L590,290 L570,290 Z" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
    <!-- 標題背景 -->
    <rect x="10" y="10" width="580" height="40" rx="10" fill="#3182ce"/>
    <rect x="10" y="40" width="580" height="10" fill="#3182ce"/>
    <!-- 標題文字 -->
    <text x="300" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">論點卡片 3：謙遜 (Humility)</text>
    <!-- 內容文字 -->
    <text x="25" y="70" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0">定義：</text>
    <text x="25" y="100" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e0">每天承認自己有犯錯的能力，並以此為基礎建構生活，確保錯誤發生時不至於崩潰。這是生存的關鍵，也是智慧的開端。</text>
    <text x="25" y="150" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0">實踐方法：</text>
    <text x="25" y="170" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e0">- 經常說「我不知道」、主動尋找反駁自己觀點的證據、避免確定性之病。</text>
    <text x="25" y="220" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0">關鍵引述：</text>
    <text x="25" y="245" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e0">「智慧是能夠說出『我不知道』的能力。」</text>
  </g>

  <!-- 卡片4 -->
  <g transform="translate(0, 900)">
    <!-- 背景 -->
    <rect x="10" y="10" width="580" height="280" rx="10" fill="url(#cardGradient4)" filter="url(#shadow)"/>
    <!-- 邊框 -->
    <rect x="10" y="10" width="580" height="280" rx="10" fill="none" stroke="url(#circuitGradient)" stroke-width="2" class="breathe-border"/>
    <!-- 裝飾線條 -->
    <rect x="15" y="15" width="570" height="270" rx="8" fill="none" stroke="url(#circuitGradient)" stroke-width="1" filter="url(#circuitGlow)" class="circuit-line"/>
    <rect x="20" y="20" width="560" height="260" rx="6" fill="none" stroke="rgba(0, 187, 255, 0.3)" stroke-width="0.5" filter="url(#circuitGlow)" class="circuit-line"/>
    <!-- 角落裝飾 -->
    <path d="M10,10 L30,10 L30,30 L10,30 Z" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
    <path d="M570,10 L590,10 L590,30 L570,30 Z" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
    <path d="M10,270 L30,270 L30,290 L10,290 Z" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
    <path d="M570,270 L590,270 L590,290 L570,290 Z" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
    <!-- 標題背景 -->
    <rect x="10" y="10" width="580" height="40" rx="10" fill="#3182ce"/>
    <rect x="10" y="40" width="580" height="10" fill="#3182ce"/>
    <!-- 標題文字 -->
    <text x="300" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">論點卡片 4：嫉妒 (Envy)</text>
    <!-- 內容文字 -->
    <text x="25" y="70" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0">定義：</text>
    <text x="25" y="100" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e0">唯一一種無法帶來任何樂趣的罪惡。它源於缺乏自重，表現為用他人的記分板來衡量自己的人生，最終導致痛苦與非理性。</text>
    <text x="25" y="150" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0">實踐方法：</text>
    <text x="25" y="170" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e0">- 停止計分、祝賀他人的成功然後回歸自己的生活、培養感恩之心。</text>
    <text x="25" y="220" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0">關鍵引述：</text>
    <text x="25" y="245" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e0">「嫉妒是唯一一種毫無樂趣的罪惡。…你只是坐在那裡怨恨，而另一個人正享受著他的遊艇。」</text>
  </g>
</svg>