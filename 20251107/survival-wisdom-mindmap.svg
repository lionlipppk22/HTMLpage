<svg width="600" height="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 中心圓漸層 -->
    <linearGradient id="wisdomGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991b1b;stop-opacity:1" />
    </linearGradient>
    
    <!-- 要素1漸層 (時間的價值超越金錢) -->
    <linearGradient id="timeValueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c2d12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#431407;stop-opacity:1" />
    </linearGradient>
    
    <!-- 要素2漸層 (生存勝於才華) -->
    <linearGradient id="survivalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c4a6e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>
    
    <!-- 要素3漸層 (日常行為的複利) -->
    <linearGradient id="compoundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#134e4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#115e59;stop-opacity:1" />
    </linearGradient>
    
    <!-- 要素4漸層 (心態決定一切) -->
    <linearGradient id="mindsetGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#581c87;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#701a75;stop-opacity:1" />
    </linearGradient>
    
    <!-- 要素5漸層 (自主權是最終的自由) -->
    <linearGradient id="ownershipGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#581c87;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#701a75;stop-opacity:1" />
    </linearGradient>
    
    <!-- 呼吸動畫效果 -->
    <filter id="breatheGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 呼吸動畫 CSS -->
    <style>
      @keyframes mindmapBreathe {
        0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.3));
        }
        50% {
          transform: scale(1.02);
          filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.6));
        }
      }
      
      @keyframes elementBreathe {
        0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.4));
        }
        50% {
          transform: scale(1.01);
          filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.7));
        }
      }
      
      .breathe-center {
        animation: mindmapBreathe 4s ease-in-out infinite;
      }
      
      .breathe-element {
        animation: elementBreathe 3s ease-in-out infinite;
      }
    </style>
    
    <!-- 陰影效果 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect x="10" y="10" width="580" height="1180" rx="15" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  
  <!-- 標題背景 -->
  <rect x="10" y="10" width="580" height="70" rx="15" fill="#991b1b"/>
  
  <!-- 標題文字 -->
  <text x="300" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
    六十歲後的生存智慧
  </text>
  <text x="300" y="55" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="white">
    核心要訣總覽
  </text>
  
  <!-- 中心圓 -->
  <circle cx="300" cy="160" r="65" fill="url(#wisdomGradient)" stroke="#e5e7eb" stroke-width="3" filter="url(#shadow)" class="breathe-center"/>
  <text x="300" y="150" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    生存智慧
  </text>
  <text x="300" y="170" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">
    核心要訣
  </text>
  
  <!-- 連接線 -->
  <line x1="300" y1="225" x2="300" y2="300" stroke="#dc2626" stroke-width="3"/>
  <line x1="300" y1="410" x2="300" y2="480" stroke="#dc2626" stroke-width="3"/>
  <line x1="300" y1="590" x2="300" y2="660" stroke="#dc2626" stroke-width="3"/>
  <line x1="300" y1="770" x2="300" y2="840" stroke="#dc2626" stroke-width="3"/>
  <line x1="300" y1="950" x2="300" y2="1020" stroke="#dc2626" stroke-width="3"/>
  
  <!-- 要素1：時間的價值超越金錢 -->
  <rect x="50" y="300" width="500" height="110" rx="10" fill="url(#timeValueGradient)" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)" class="breathe-element"/>
  <text x="300" y="320" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
    1. 時間的價值超越金錢
  </text>
  <text x="300" y="350" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fde68a">
    強調時間的不可逆轉性
  </text>
  <text x="300" y="375" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fde68a">
    將剩餘的寶貴光陰浪費在嫉妒、憤怒或無益的追逐上，是晚年最昂貴的揮霍
  </text>
  
  <!-- 要素2：生存勝於才華 -->
  <rect x="50" y="480" width="500" height="110" rx="10" fill="url(#survivalGradient)" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)" class="breathe-element"/>
  <text x="300" y="500" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
    2. 生存勝於才華
  </text>
  <text x="300" y="530" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#bfdbfe">
    避免一次災難性的失敗，其重要性遠遠超過抓住一百次微小的成功
  </text>
  <text x="300" y="555" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#bfdbfe">
    耐久性勝過一時的輝煌
  </text>
  
  <!-- 要素3：日常行為的複利 -->
  <rect x="50" y="660" width="500" height="110" rx="10" fill="url(#compoundGradient)" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)" class="breathe-element"/>
  <text x="300" y="680" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
    3. 日常行為的複利
  </text>
  <text x="300" y="710" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#a7f3d0">
    當事業與財富的增長引擎熄火後，這是唯一剩下且仍在運轉的複利力量
  </text>
  <text x="300" y="735" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#a7f3d0">
    我們的健康、脾氣和日常選擇，既可以成就我們，也可以毀滅我們
  </text>
  
  <!-- 要素4：心態決定一切 -->
  <rect x="50" y="840" width="500" height="110" rx="10" fill="url(#mindsetGradient)" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)" class="breathe-element"/>
  <text x="300" y="860" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
    4. 心態決定一切
  </text>
  <text x="300" y="890" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#f0abfc">
    嫉妒保證痛苦，傲慢引向毀滅，謙遜帶來生存，而感恩則是通往內心平靜
  </text>
  <text x="300" y="915" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#e879f9">
    這些心態直接塑造了我們晚年生活的品質
  </text>
  
  <!-- 要素5：自主權是最終的自由 -->
  <rect x="50" y="1020" width="500" height="100" rx="10" fill="url(#ownershipGradient)" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)" class="breathe-element"/>
  <text x="300" y="1040" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
    5. 自主權是最終的自由
  </text>
  <text x="300" y="1070" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#f0abfc">
    真正的自由 ——擁有自己的時間、決策與財務，而非依賴他人的頭銜與認可
  </text>
</svg>