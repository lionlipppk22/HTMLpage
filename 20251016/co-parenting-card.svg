<svg width="800" height="420" viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <!-- 定義漸層 -->
  <defs>
    <!-- 背景漸層 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8edea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fed6e3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffecd2;stop-opacity:1" />
    </linearGradient>

    <!-- 標題漸層 -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>

    <!-- 定義區域漸層 -->
    <linearGradient id="definitionGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e1f5fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b3e5fc;stop-opacity:1" />
    </linearGradient>

    <!-- 方法區域漸層 -->
    <linearGradient id="methodGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f3e5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ce93d8;stop-opacity:1" />
    </linearGradient>

    <!-- 範例區域漸層 -->
    <linearGradient id="exampleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8f5e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a5d6a7;stop-opacity:1" />
    </linearGradient>

    <!-- 陰影濾鏡 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- 主背景 -->
  <rect width="800" height="420" fill="url(#bgGradient)" rx="25"/>

  <!-- 裝飾圖案 -->
  <circle cx="80" cy="80" r="40" fill="#ffffff30" opacity="0.4"/>
  <circle cx="720" cy="90" r="50" fill="#ffffff25" opacity="0.3"/>
  <circle cx="100" cy="340" r="35" fill="#ffffff35" opacity="0.4"/>
  <circle cx="700" cy="350" r="45" fill="#ffffff30" opacity="0.3"/>

  <!-- 主卡片背景 -->
  <rect x="40" y="30" width="720" height="360" fill="#ffffff" stroke="#e0e0e0" stroke-width="2" rx="20" filter="url(#shadow)"/>

  <!-- 標題區域 -->
  <rect x="50" y="45" width="700" height="70" fill="url(#titleGradient)" rx="15"/>
  <text x="400" y="70" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="bold">
    論點綱要卡片：共親職與正向溝通
  </text>
  <text x="400" y="95" text-anchor="middle" fill="#f8f9fa" font-family="Arial, sans-serif" font-size="14">
    建立和諧的家庭團隊合作
  </text>

  <!-- 定義區域 -->
  <rect x="60" y="130" width="680" height="75" fill="url(#definitionGradient)" stroke="#0277bd" stroke-width="2" rx="12"/>
  <text x="80" y="150" fill="#01579b" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    定義：
  </text>
  <text x="80" y="175" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14">
    共親職指家庭成員（不限夫妻）共同參與照顧孩子，成為彼此的神隊友。
  </text>

  <!-- 方法步驟區域 -->
  <rect x="60" y="220" width="680" height="110" fill="url(#methodGradient)" stroke="#7b1fa2" stroke-width="2" rx="12"/>
  <text x="80" y="240" fill="#4a148c" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    方法/步驟：
  </text>
  <text x="80" y="265" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14">
    1. 建立共同教養價值觀，智慧處理親友建議。
  </text>
  <text x="80" y="285" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14">
    2. 以具體的請求和鼓勵邀請伴侶參與。
  </text>
  <text x="80" y="305" fill="#2c3e50" font-family="Arial, sans-serif" font-size="14">
    3. 發生衝突時，使用「我訊息」清晰表達感受與期望。
  </text>

  <!-- 範例區域 -->
  <rect x="60" y="345" width="680" height="45" fill="url(#exampleGradient)" stroke="#2e7d32" stroke-width="2" rx="12"/>
  <text x="80" y="365" fill="#1b5e20" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    範例（我訊息）：
  </text>
  <text x="80" y="380" fill="#2e7d32" font-family="Arial, sans-serif" font-size="12">
    「當你（事件），我感到（情緒），因為（原因）。我希望你（期望）。」
  </text>

</svg>