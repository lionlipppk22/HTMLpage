<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient definitions for visual appeal -->
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE4E1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFF8DC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F8FF;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="#00000030"/>
    </filter>
    
    <!-- Animation for floating effect -->
    <animateTransform id="float" attributeName="transform" type="translate" 
                      values="0,0; 0,-2; 0,0; 0,2; 0,0" dur="3s" repeatCount="indefinite"/>
  </defs>
  
  <!-- Main card background -->
  <rect width="550" height="350" x="25" y="25" rx="15" ry="15" 
        fill="url(#cardGradient)" stroke="#DDA0DD" stroke-width="2" 
        filter="url(#dropShadow)" style="animation: float 3s ease-in-out infinite; transform-origin: center;"/>
  
  <!-- Card header -->
  <rect width="550" height="60" x="25" y="25" rx="15" ry="15" fill="#9370DB" opacity="0.8"/>
  <text x="300" y="55" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">
    論點綱要卡片：安全依附關係
  </text>
  
  <!-- Definition section -->
  <rect width="500" height="80" x="50" y="100" rx="8" ry="8" fill="#F8F8FF" stroke="#9370DB" stroke-width="1"/>
  <text x="60" y="120" fill="#4B0082" font-family="Arial, sans-serif" font-size="14" font-weight="bold">定義：</text>
  <text x="60" y="140" fill="#2F4F4F" font-family="Arial, sans-serif" font-size="12">
    一種讓孩子感到有安全感、勇於探索及能適應世界的親子關係。
  </text>
  
  <!-- Methods section -->
  <rect width="500" height="120" x="50" y="190" rx="8" ry="8" fill="#F0F8FF" stroke="#9370DB" stroke-width="1"/>
  <text x="60" y="210" fill="#4B0082" font-family="Arial, sans-serif" font-size="14" font-weight="bold">方法/步驟：</text>
  <text x="60" y="230" fill="#2F4F4F" font-family="Arial, sans-serif" font-size="11">
    1. 及時溫暖的回應：敏銳覺察並滿足孩子的需求。
  </text>
  <text x="60" y="245" fill="#2F4F4F" font-family="Arial, sans-serif" font-size="11">
    2. 看重身體接觸：給予擁抱、輕撫等親密接觸。
  </text>
  <text x="60" y="260" fill="#2F4F4F" font-family="Arial, sans-serif" font-size="11">
    3. 建立規律作息：定時的餵食、睡眠與遊戲有助於建立安全感。
  </text>
  
  <!-- Example section -->
  <rect width="500" height="60" x="50" y="320" rx="8" ry="8" fill="#FFF8DC" stroke="#9370DB" stroke-width="1"/>
  <text x="60" y="335" fill="#4B0082" font-family="Arial, sans-serif" font-size="14" font-weight="bold">範例：</text>
  <text x="60" y="350" fill="#2F4F4F" font-family="Arial, sans-serif" font-size="10">
    「透過臉部表情、眼神接觸、說話與兒歌來與寶貝互動，可以加強親子之間的情感連結。」
  </text>
  
  <!-- Decorative elements -->
  <circle cx="520" cy="60" r="8" fill="#FFD700" opacity="0.7">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="60" r="6" fill="#FFA500" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Hover effects (CSS would be needed for full interactivity) -->
  <style>
    .card:hover rect { transform: scale(1.02); transition: transform 0.3s ease; }
    .card:hover { cursor: pointer; }
  </style>
</svg>