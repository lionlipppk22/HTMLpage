<svg width="600" height="900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Card 1: Red gradient -->
    <linearGradient id="cardGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c53030;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#742a2a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Card 2: Blue gradient -->
    <linearGradient id="cardGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c5aa0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a365d;stop-opacity:1" />
    </linearGradient>
    
    <!-- Card 3: Green gradient -->
    <linearGradient id="cardGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22543d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#11311d;stop-opacity:1" />
    </linearGradient>
    
    <!-- Cyan glow gradient -->
    <linearGradient id="circuitGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#00b3ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:0.8" />
    </linearGradient>
    
    <!-- Breathe glow filter -->
    <filter id="breatheGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Circuit glow filter -->
    <filter id="circuitGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    
    <!-- Animations -->
    <style>
      @keyframes breathe {
        0%, 100% {
          stroke-width: 2;
          stroke: url(#circuitGradient);
          filter: drop-shadow(0 0 5px rgba(0, 187, 255, 0.6));
          transform: scale(1);
        }
        25% {
          stroke-width: 3;
          stroke: #00ffff;
          filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.8));
          transform: scale(1.005);
        }
        50% {
          stroke-width: 4;
          stroke: #0066ff;
          filter: drop-shadow(0 0 15px rgba(0, 102, 255, 0.9));
          transform: scale(1.01);
        }
        75% {
          stroke-width: 3;
          stroke: #00b3ff;
          filter: drop-shadow(0 0 10px rgba(0, 179, 255, 0.8));
          transform: scale(1.005);
        }
      }
      
      @keyframes circuitPulse {
        0%, 100% {
          stroke-dashoffset: 0;
          stroke-opacity: 0.6;
        }
        50% {
          stroke-dashoffset: -10;
          stroke-opacity: 1;
        }
      }
      
      .breathe-border {
        animation: breathe 3s ease-in-out infinite;
      }
      
      .circuit-line {
        stroke-dasharray: 5 3;
        animation: circuitPulse 2s linear infinite;
      }
    </style>
  </defs>
  
  <!-- ===== CARD 1: RED (Top) ===== -->
  <!-- Card background -->
  <rect x="10" y="10" width="580" height="260" rx="10" fill="url(#cardGradient1)" filter="url(#shadow)"/>
  
  <!-- Breathing border -->
  <rect x="10" y="10" width="580" height="260" rx="10" fill="none" stroke="url(#circuitGradient)" stroke-width="2" class="breathe-border"/>
  
  <!-- Circuit decorations -->
  <rect x="15" y="15" width="570" height="250" rx="8" fill="none" stroke="url(#circuitGradient)" stroke-width="1" filter="url(#circuitGlow)" class="circuit-line"/>
  <rect x="20" y="20" width="560" height="240" rx="6" fill="none" stroke="rgba(0, 187, 255, 0.3)" stroke-width="0.5" filter="url(#circuitGlow)" class="circuit-line"/>
  
  <!-- Corner decorations -->
  <path d="M10,10 L30,10 L30,30 L10,30 Z" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
  <path d="M570,10 L590,10 L590,30 L570,30 Z" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
  <path d="M10,250 L30,250 L30,270 L10,270 Z" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
  <path d="M570,250 L590,250 L590,270 L570,270 Z" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
  
  <!-- Header background -->
  <rect x="10" y="10" width="580" height="40" rx="10" fill="#c53030"/>
  <rect x="10" y="40" width="580" height="8" fill="#c53030"/>
  
  <!-- Title -->
  <text x="300" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
    卡片一：發炎與胰島素
  </text>
  
  <!-- Content -->
  <text x="25" y="65" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffe2e2">
    定義：血管內壁慢性損傷與氧化反應
  </text>
  <text x="25" y="85" font-family="Arial, sans-serif" font-size="12" fill="#f5d5d5">
    核心成因：高胰島素 + 抗氧化劑缺乏
  </text>
  <text x="25" y="105" font-family="Arial, sans-serif" font-size="12" fill="#f5d5d5">
    解決方案：低碳水高脂肪飲食 + 蔬菜
  </text>
  <text x="25" y="140" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffe2e2">
    三個關鍵要點：
  </text>
  <text x="25" y="160" font-family="Arial, sans-serif" font-size="12" fill="#f5d5d5">
    1. 戒除精緻糖與碳水化合物
  </text>
  <text x="25" y="180" font-family="Arial, sans-serif" font-size="12" fill="#f5d5d5">
    2. 攝取維生素 C 與 E
  </text>
  <text x="25" y="200" font-family="Arial, sans-serif" font-size="12" fill="#f5d5d5">
    3. 大量食用綠葉蔬菜
  </text>
  <text x="25" y="235" font-family="Arial, sans-serif" font-size="11" fill="#ffb3b3" font-style="italic">
    「選擇上帝創造的天然食物，拒絕人工加工品」
  </text>
  
  <!-- ===== CARD 2: BLUE (Middle) ===== -->
  <!-- Card background -->
  <rect x="10" y="290" width="580" height="260" rx="10" fill="url(#cardGradient2)" filter="url(#shadow)"/>
  
  <!-- Breathing border -->
  <rect x="10" y="290" width="580" height="260" rx="10" fill="none" stroke="url(#circuitGradient)" stroke-width="2" class="breathe-border"/>
  
  <!-- Circuit decorations -->
  <rect x="15" y="295" width="570" height="250" rx="8" fill="none" stroke="url(#circuitGradient)" stroke-width="1" filter="url(#circuitGlow)" class="circuit-line"/>
  <rect x="20" y="300" width="560" height="240" rx="6" fill="none" stroke="rgba(0, 187, 255, 0.3)" stroke-width="0.5" filter="url(#circuitGlow)" class="circuit-line"/>
  
  <!-- Corner decorations -->
  <path d="M10,290 L30,290 L30,310 L10,310 Z" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
  <path d="M570,290 L590,290 L590,310 L570,310 Z" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
  <path d="M10,530 L30,530 L30,550 L10,550 Z" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
  <path d="M570,530 L590,530 L590,550 L570,550 Z" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
  
  <!-- Header background -->
  <rect x="10" y="290" width="580" height="40" rx="10" fill="#2c5aa0"/>
  <rect x="10" y="320" width="580" height="8" fill="#2c5aa0"/>
  
  <!-- Title -->
  <text x="300" y="315" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
    卡片二：異常血栓的完美風暴
  </text>
  
  <!-- Content -->
  <text x="25" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#b3d9ff">
    定義：由內毒素觸發的堅韌血塊
  </text>
  <text x="25" y="365" font-family="Arial, sans-serif" font-size="12" fill="#cce5ff">
    佔心臟病發作的 80-90% 主因
  </text>
  
  <text x="25" y="395" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#b3d9ff">
    形成三步驟：
  </text>
  <text x="25" y="415" font-family="Arial, sans-serif" font-size="12" fill="#cce5ff">
    1. 滲漏：腸道/牙齦破損 → 內毒素
  </text>
  <text x="25" y="435" font-family="Arial, sans-serif" font-size="12" fill="#cce5ff">
    2. 燃料：血液過量游離鐵
  </text>
  <text x="25" y="455" font-family="Arial, sans-serif" font-size="12" fill="#cce5ff">
    3. 催化：壓力削弱免疫系統
  </text>
  <text x="25" y="490" font-family="Arial, sans-serif" font-size="11" fill="#99ccff" font-style="italic">
    「壓力可將心臟病風險提升 2000%」
  </text>
  
  <!-- ===== CARD 3: GREEN (Bottom) ===== -->
  <!-- Card background -->
  <rect x="10" y="570" width="580" height="320" rx="10" fill="url(#cardGradient3)" filter="url(#shadow)"/>
  
  <!-- Breathing border -->
  <rect x="10" y="570" width="580" height="320" rx="10" fill="none" stroke="url(#circuitGradient)" stroke-width="2" class="breathe-border"/>
  
  <!-- Circuit decorations -->
  <rect x="15" y="575" width="570" height="310" rx="8" fill="none" stroke="url(#circuitGradient)" stroke-width="1" filter="url(#circuitGlow)" class="circuit-line"/>
  <rect x="20" y="580" width="560" height="300" rx="6" fill="none" stroke="rgba(0, 187, 255, 0.3)" stroke-width="0.5" filter="url(#circuitGlow)" class="circuit-line"/>
  
  <!-- Corner decorations -->
  <path d="M10,570 L30,570 L30,590 L10,590 Z" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
  <path d="M570,570 L590,570 L590,590 L570,590 Z" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
  <path d="M10,870 L30,870 L30,890 L10,890 Z" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
  <path d="M570,870 L590,870 L590,890 L570,890 Z" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
  
  <!-- Header background -->
  <rect x="10" y="570" width="580" height="40" rx="10" fill="#22543d"/>
  <rect x="10" y="600" width="580" height="8" fill="#22543d"/>
  
  <!-- Title -->
  <text x="300" y="595" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
    卡片三：守護心臟的完美餐盤
  </text>
  
  <!-- Content -->
  <text x="25" y="625" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#a8f5a8">
    目標：瓦解「完美風暴」的每一環節
  </text>
  
  <text x="25" y="655" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#a8f5a8">
    完美餐盤組合：
  </text>
  <text x="25" y="675" font-family="Arial, sans-serif" font-size="12" fill="#d4f5d4">
    • 蛋白質：野生鮭魚（Omega-3 + 低鐵）
  </text>
  <text x="25" y="695" font-family="Arial, sans-serif" font-size="12" fill="#d4f5d4">
    • 沙拉：芝麻葉 + 甜菜根（一氧化氮最豐）
  </text>
  <text x="25" y="715" font-family="Arial, sans-serif" font-size="12" fill="#d4f5d4">
    • 調料：橄欖油 + 蘋果醋 + 大蒜
  </text>
  <text x="25" y="735" font-family="Arial, sans-serif" font-size="12" fill="#d4f5d4">
    • 發酵品：德國酸菜（乳酸菌防毒素）
  </text>
  <text x="25" y="755" font-family="Arial, sans-serif" font-size="12" fill="#d4f5d4">
    • 飲品：綠茶/紅茶 或 85% 黑巧克力
  </text>
  
  <text x="25" y="785" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#a8f5a8">
    輔助行動：
  </text>
  <text x="25" y="805" font-family="Arial, sans-serif" font-size="12" fill="#d4f5d4">
    餐後進行 10-20 分鐘「鼻吸口呼」散步
  </text>
  <text x="25" y="825" font-family="Arial, sans-serif" font-size="12" fill="#d4f5d4">
    以增加一氧化氮，預防血栓
  </text>
</svg>
