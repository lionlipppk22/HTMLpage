<svg width="500" height="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 中心圓漸層 -->
    <linearGradient id="centerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991b1b;stop-opacity:1" />
    </linearGradient>
    
    <!-- 節點1漸層 - 根本問題 (紅色) -->
    <linearGradient id="node1Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a16207;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5d3a1a;stop-opacity:1" />
    </linearGradient>
    
    <!-- 節點2漸層 - 致命血栓 (藍色) -->
    <linearGradient id="node2Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c4a6e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>
    
    <!-- 節點3漸層 - 飲食關鍵 (綠色) -->
    <linearGradient id="node3Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#134e4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#115e59;stop-opacity:1" />
    </linearGradient>
    
    <!-- 節點4漸層 - 營養寶庫 (紫色) -->
    <linearGradient id="node4Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#581c87;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#701a75;stop-opacity:1" />
    </linearGradient>
    
    <!-- 節點5漸層 - 終極餐盤 (銀灰) -->
    <linearGradient id="node5Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#475569;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    
    <!-- 呼吸動畫效果 -->
    <filter id="breatheGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 呼吸動畫 CSS -->
    <style>
      @keyframes mindmapBreathe {
        0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.3));
        }
        50% {
          transform: scale(1.02);
          filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.6));
        }
      }
      
      @keyframes elementBreathe {
        0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.4));
        }
        50% {
          transform: scale(1.01);
          filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.7));
        }
      }
      
      .breathe-center {
        animation: mindmapBreathe 4s ease-in-out infinite;
      }
      
      .breathe-element {
        animation: elementBreathe 3s ease-in-out infinite;
      }
    </style>
    
    <!-- 陰影效果 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect x="10" y="10" width="480" height="1180" rx="15" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  
  <!-- 標題背景 -->
  <rect x="10" y="10" width="480" height="70" rx="15" fill="#991b1b"/>
  
  <!-- 標題文字 -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
    心臟健康核心要訣
  </text>
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">
    5大要點智慧導圖
  </text>
  
  <!-- 中心圓 -->
  <circle cx="250" cy="160" r="65" fill="url(#centerGradient)" stroke="#e5e7eb" stroke-width="3" filter="url(#shadow)" class="breathe-center"/>
  <text x="250" y="150" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    守護心臟
  </text>
  <text x="250" y="170" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">
    5大關鍵
  </text>
  
  <!-- 連接線 -->
  <line x1="250" y1="225" x2="250" y2="300" stroke="#dc2626" stroke-width="3"/>
  <line x1="250" y1="410" x2="250" y2="480" stroke="#dc2626" stroke-width="3"/>
  <line x1="250" y1="590" x2="250" y2="660" stroke="#dc2626" stroke-width="3"/>
  <line x1="250" y1="770" x2="250" y2="840" stroke="#dc2626" stroke-width="3"/>
  <line x1="250" y1="950" x2="250" y2="1020" stroke="#dc2626" stroke-width="3"/>
  
  <!-- 節點1：根本問題 -->
  <rect x="50" y="300" width="400" height="110" rx="10" fill="url(#node1Gradient)" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)" class="breathe-element"/>
  <text x="250" y="320" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
    1. 根本問題
  </text>
  <text x="250" y="350" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#fde68a">
    心臟病根源非膽固醇，而是發炎
  </text>
  <text x="250" y="375" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#fde68a">
    由高胰島素與營養素缺乏引發
  </text>
  <text x="250" y="400" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#fbbf24">
    需要根本性飲食改變與營養調整
  </text>
  
  <!-- 節點2：致命血栓 -->
  <rect x="50" y="480" width="400" height="130" rx="10" fill="url(#node2Gradient)" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)" class="breathe-element"/>
  <text x="250" y="500" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
    2. 致命血栓
  </text>
  <text x="250" y="530" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#bfdbfe">
    80-90% 心臟病發作源於異常血栓
  </text>
  <text x="250" y="555" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#bfdbfe">
    形成與腸道滲漏、內毒素、過量鐵質相關
  </text>
  <text x="250" y="580" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#93c5fd">
    需要修復腸道屏障與控制游離鐵
  </text>
  
  <!-- 節點3：飲食關鍵 -->
  <rect x="50" y="660" width="400" height="110" rx="10" fill="url(#node3Gradient)" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)" class="breathe-element"/>
  <text x="250" y="680" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
    3. 飲食關鍵
  </text>
  <text x="250" y="710" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#a7f3d0">
    戒除精緻碳水與糖，會耗盡 B 群
  </text>
  <text x="250" y="735" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#a7f3d0">
    升高胰島素並助長血管發炎反應
  </text>
  <text x="250" y="760" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#6ee7b7">
    選擇低碳水、高優質脂肪飲食方式
  </text>
  
  <!-- 節點4：營養寶庫 -->
  <rect x="50" y="840" width="400" height="110" rx="10" fill="url(#node4Gradient)" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)" class="breathe-element"/>
  <text x="250" y="860" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
    4. 營養寶庫
  </text>
  <text x="250" y="890" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#f0abfc">
    大量攝取蔬菜，特別是綠葉蔬菜
  </text>
  <text x="250" y="915" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#f0abfc">
    提供鉀、鎂、抗氧化劑保護心血管
  </text>
  <text x="250" y="940" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#e879f9">
    防止心律不整與肌肉痙攣
  </text>
  
  <!-- 節點5：終極餐盤 -->
  <rect x="50" y="1020" width="400" height="130" rx="10" fill="url(#node5Gradient)" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)" class="breathe-element"/>
  <text x="250" y="1040" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
    5. 終極餐盤
  </text>
  <text x="250" y="1070" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#cbd5e1">
    野生鮭魚、芝麻葉、甜菜根、大蒜
  </text>
  <text x="250" y="1095" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#cbd5e1">
    搭配發酵食品，全面對抗異常血栓
  </text>
  <text x="250" y="1120" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#a1a5b4">
    科學飲食與活動結合，守護心臟健康
  </text>
</svg>
