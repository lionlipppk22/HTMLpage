<svg width="600" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2b6cb0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a365d;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 卡片背景 -->
  <rect x="10" y="10" width="580" height="280" rx="10" fill="url(#cardGradient2)" filter="url(#shadow2)"/>
  
  <!-- 卡片邊框 -->
  <rect x="10" y="10" width="580" height="280" rx="10" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- 標題背景 -->
  <rect x="10" y="10" width="580" height="40" rx="10" fill="#2c5282"/>
  <rect x="10" y="40" width="580" height="10" fill="#2c5282"/>
  
  <!-- 標題文字 -->
  <text x="300" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
    論點卡片 2：國際數位勞工分工 (IDDL)
  </text>
  
  <!-- 內容文字 -->
  <text x="25" y="70" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0">
    定義：
  </text>
  <text x="25" y="100" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e0">
    一個全球性的勞動網絡，包含生產數位媒體所需的農業、工業與資訊勞動。
  </text>
  <text x="25" y="120" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e0">
    跨國公司利用此分工，將勞動外包以最大化利潤。
  </text>
  
  <text x="25" y="150" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0">
    結構層次：
  </text>
  <text x="25" y="170" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e0">
    1. 礦物開採（如：剛果的奴隸礦工）
  </text>
  <text x="25" y="195" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e0">
    2. 硬體組裝（如：中國富士康的工人）
  </text>
  <text x="25" y="220" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e0">
    3. 軟體工程（如：矽谷的勞動貴族）
  </text>
  <text x="25" y="245" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e0">
    4. 無償用戶（如：全球的社群媒體使用者）
  </text>
  
  <text x="25" y="270" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e0">
    一支 iPhone 的誕生，涉及了非洲的礦工、中國的組裝工、美國的工程師，
  </text>
  </svg>