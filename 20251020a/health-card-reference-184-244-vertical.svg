<svg width="540" height="960" viewBox="0 0 540 960" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Reference card lines 184-244 vertical gradient">
  <defs>
    <!-- 漸層 -->
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9a9e"/>
      <stop offset="25%" stop-color="#fad0c4"/>
      <stop offset="50%" stop-color="#fbc2eb"/>
      <stop offset="75%" stop-color="#a6c1ee"/>
      <stop offset="100%" stop-color="#84fab0"/>
    </linearGradient>

    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="50%" stop-color="#fda085"/>
      <stop offset="100%" stop-color="#f6d365"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#00000033"/>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="roundClip">
      <rect x="20" y="20" width="500" height="920" rx="20" ry="20"/>
    </clipPath>
  </defs>

  <!-- 外框背景 -->
  <rect x="10" y="10" width="520" height="940" rx="28" ry="28" fill="url(#g1)"/>

  <!-- 內框並套上漸層 -->
  <g clip-path="url(#roundClip)">
    <rect x="20" y="20" width="500" height="240" rx="16" ry="16" fill="url(#g2)" stroke="#ffffff" stroke-width="1.5" filter="url(#softShadow)"/>
    <rect x="20" y="280" width="500" height="240" rx="16" ry="16" fill="#ffffff" opacity="0.08"/>
    <rect x="20" y="540" width="500" height="360" rx="16" ry="16" fill="#ffffff" opacity="0.06"/>
  </g>

  <!-- 裝飾漸層弧線（頂部） -->
  <path d="M20 180 C160 80 380 80 500 180 L500 260 L20 260 Z" fill="url(#g1)" opacity="0.18" filter="url(#glow)"/>

  <!-- 第一區塊：主題1（十字花科） - 放在最上 -->
  <g transform="translate(20,20)">
    <rect x="0" y="0" width="500" height="240" rx="12" ry="12" fill="rgba(255,255,255,0.06)"/>
    <text x="24" y="36" font-family="Chiron GoRound TC, Arial, sans-serif" font-size="20" font-weight="700" fill="#1b2631">十字花科蔬菜的力量</text>
    <text x="24" y="58" font-family="Chiron GoRound TC, Arial, sans-serif" font-size="14" fill="#17202a" opacity="0.5">The Power of Cruciferous Vegetables</text>

    <line x1="24" y1="72" x2="476" y2="72" stroke="#ffffff" stroke-width="0.6" opacity="0.12"/>

    <text x="24" y="112" font-family="Chiron GoRound TC, Arial, sans-serif" font-size="14" fill="#0f2730" width="452">
      一類富含獨特抗癌物質的蔬菜，如花椰菜、高麗菜、甘藍、白蘿蔔等。
    </text>

    <text x="24" y="148" font-family="Chiron GoRound TC, Arial, sans-serif" font-size="14" fill="#0f2730">
      蘿蔔硫素 與異硫氰酸鹽，能啟動肝臟第二階段解毒機制，協助排除致癌物質。
    </text>

    <text x="24" y="168" font-family="Chiron GoRound TC, Arial, sans-serif" font-size="14" fill="#122127" font-weight="700">● 實踐方法</text>
    <text x="24" y="184" font-family="Chiron GoRound TC, Arial, sans-serif" font-size="14" fill="#0f2730">1. 將多種十字花科蔬菜納入每週菜單</text>
    <text x="24" y="198" font-family="Chiron GoRound TC, Arial, sans-serif" font-size="14" fill="#0f2730">2. 切好後靜置30–90分鐘再烹調，保留更多活性成分</text>

    <g transform="translate(424,92) scale(1.2)">
      <!-- 小插圖：花椰菜簡圖 -->
      <g fill="#ffffff" opacity="0.4">
        <circle cx="28" cy="24" r="18" />
        <rect x="20" y="36" width="16" height="30" rx="4" />
        <path d="M10 24 C18 12, 38 12, 46 24" fill="#ffffff"/>
      </g>
    </g>
  </g>

  <!-- 第二區塊：久坐（中段） -->
  <g transform="translate(20,280)">
    <rect x="0" y="0" width="500" height="240" rx="16" ry="16" fill="rgba(255,255,255,0.06)" stroke="#ffffff" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="24" y="36" font-family="Chiron GoRound TC, Arial, sans-serif" font-size="20" font-weight="700" fill="#1b2631">破除「久坐」的詛咒</text>
    <text x="24" y="58" font-family="Chiron GoRound TC, Arial, sans-serif" font-size="14" fill="#17202a" opacity="0.85">Breaking the Sedentary Curse</text>

    <line x1="24" y1="72" x2="476" y2="72" stroke="#ffffff" stroke-width="0.6" opacity="0.12"/>

    <text x="24" y="112" font-family="Chiron GoRound TC, Arial, sans-serif" font-size="14" fill="#0f2730">
      除睡眠外，每日坐著或躺著超過6小時的長時間靜態行為。
    </text>

    <text x="24" y="148" font-family="Chiron GoRound TC, Arial, sans-serif" font-size="14" fill="#0f2730">- 循環變慢，乳酸堆積，形成酸性環境</text>
    <text x="24" y="162" font-family="Chiron GoRound TC, Arial, sans-serif" font-size="14" fill="#0f2730">- 發炎增加，自由基與發炎指標升高</text>
    <text x="24" y="176" font-family="Chiron GoRound TC, Arial, sans-serif" font-size="14" fill="#0f2730">- 澳洲研究比喻：久坐一小時相當於抽一根菸</text>

    <text x="24" y="196" font-family="Chiron GoRound TC, Arial, sans-serif" font-size="14" font-weight="700" fill="#122127">● 應對步驟</text>
    <text x="24" y="212" font-family="Chiron GoRound TC, Arial, sans-serif" font-size="14" fill="#0f2730">1. 每30–50分鐘起身活動一次</text>
    <text x="24" y="226" font-family="Chiron GoRound TC, Arial, sans-serif" font-size="14" fill="#0f2730">2. 每週至少150分鐘中等強度運動</text>

    <g transform="translate(380,110) scale(0.9)">
      <!-- 小插圖：走路圖示 -->
      <path d="M6 36 L26 12 L40 18 L34 32 Z" fill="#ffffff" opacity="0.95"/>
      <circle cx="42" cy="38" r="6" fill="#ffffff" opacity="0.45"/>
    </g>
  </g>

  <!-- 第三區塊：睡眠（下段） -->
  <g transform="translate(20,540)">
    <rect x="0" y="0" width="500" height="360" rx="16" ry="16" fill="rgba(255,255,255,0.06)" stroke="#ffffff" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="24" y="36" font-family="Chiron GoRound TC, Arial, sans-serif" font-size="20" font-weight="700" fill="#1b2631">睡眠的抗癌奧秘</text>
    <text x="24" y="58" font-family="Chiron GoRound TC, Arial, sans-serif" font-size="14" fill="#17202a" opacity="0.85">The Anti-Cancer Secret of Sleep</text>

    <line x1="24" y1="72" x2="476" y2="72" stroke="#ffffff" stroke-width="0.6" opacity="0.12"/>

    <text x="24" y="112" font-family="Chiron GoRound TC, Arial, sans-serif" font-size="14" fill="#0f2730">在完全黑暗的環境中，獲得7–8小時優質睡眠。</text>

    <text x="24" y="148" font-family="Chiron GoRound TC, Arial, sans-serif" font-size="14" fill="#0f2730">褪黑激素（Melatonin）：僅在黑暗中由松果體分泌，是強效內生性抗癌荷爾蒙。</text>
    <text x="24" y="164" font-family="Chiron GoRound TC, Arial, sans-serif" font-size="14" fill="#0f2730">睡眠時暴露光線會透過視神經抑制褪黑激素分泌。</text>

    <text x="24" y="190" font-family="Chiron GoRound TC, Arial, sans-serif" font-size="14" font-weight="700" fill="#122127">● 實踐方法</text>
    <text x="24" y="206" font-family="Chiron GoRound TC, Arial, sans-serif" font-size="14" fill="#0f2730">1. 使用遮光窗簾，移除發光電子產品，營造全黑環境。</text>
    <text x="24" y="222" font-family="Chiron GoRound TC, Arial, sans-serif" font-size="14" fill="#0f2730">2. 固定作息，避免長期補充劑依賴。</text>

    <g transform="translate(380,140) scale(0.95)">
      <!-- 小插圖：月亮與星星 -->
      <circle cx="34" cy="24" r="22" fill="#ffffff" opacity="0.42"/>
      <path d="M14 10 L18 18 L10 14 L22 14 L14 22 Z" fill="#ffffff" opacity="0.9" transform="translate(6,24) scale(0.6)"/>
    </g>

  </g>

</svg>