<svg width="800" height="1000" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 漸層定義 -->
    <linearGradient id="cardGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#FFE66D;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FF6B6B;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="cardGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#44A08D;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#4ECDC4;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="cardGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A8E6CF;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#88D8C0;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#A8E6CF;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD93D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B6B;stop-opacity:1" />
    </linearGradient>
    
    <!-- 陰影濾鏡 -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#00000030"/>
    </filter>
    
    <!-- 發光濾鏡 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="1000" fill="url(#backgroundGradient)"/>
  <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
    <stop offset="50%" style="stop-color:#e9ecef;stop-opacity:1" />
    <stop offset="100%" style="stop-color:#dee2e6;stop-opacity:1" />
  </linearGradient>

  <!-- 裝飾性圓圈 -->
  <circle cx="100" cy="100" r="50" fill="#FF6B6B" opacity="0.1"/>
  <circle cx="700" cy="150" r="60" fill="#4ECDC4" opacity="0.1"/>
  <circle cx="150" cy="900" r="55" fill="#A8E6CF" opacity="0.1"/>
  <circle cx="650" cy="950" r="70" fill="#FFE66D" opacity="0.1"/>

  <!-- 標題 -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="url(#titleGradient)">
    敬畏神的璀璨人生：核心論點圖解
  </text>
  <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
    <stop offset="50%" style="stop-color:#4ECDC4;stop-opacity:1" />
    <stop offset="100%" style="stop-color:#A8E6CF;stop-opacity:1" />
  </linearGradient>
  
  <!-- 第一張卡片：人的困境 -->
  <g transform="translate(200, 120)">
    <!-- 卡片背景 -->
    <rect x="0" y="0" width="400" height="180" rx="15" fill="url(#cardGradient1)" stroke="#E55039" stroke-width="3" filter="url(#dropShadow)"/>

    <!-- 裝飾邊框 -->
    <rect x="5" y="5" width="390" height="170" rx="12" fill="none" stroke="#FFD93D" stroke-width="2" opacity="0.7"/>

    <!-- 標題 -->
    <text x="200" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C3E50">
      論點一：人的困境
    </text>
    <text x="200" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2C3E50" opacity="0.8">
      The Human Dilemma
    </text>

    <!-- 裝飾圖標 -->
    <circle cx="60" cy="90" r="25" fill="#E55039" opacity="0.3"/>
    <path d="M45 90 L75 90 M60 75 L60 105" stroke="#E55039" stroke-width="3" opacity="0.6"/>

    <!-- 內容 -->
    <text x="30" y="130" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">
      • 罪惡與痛苦的遺傳
    </text>
    <text x="30" y="150" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">
      • 生命短暫如夢
    </text>
    <text x="250" y="130" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">
      • 充滿勞苦愁煩
    </text>
    <text x="250" y="150" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">
      • 最終歸於塵土
    </text>
  </g>

  <!-- 向下箭頭 1 -->
  <g transform="translate(380, 320)">
    <path d="M20 0 L20 60 L15 55 M20 60 L25 55" stroke="url(#arrowGradient)" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="url(#arrowGradient)"/>
      </marker>
    </defs>
  </g>

  <!-- 第二張卡片：神的要求 -->
  <g transform="translate(200, 380)">
    <!-- 卡片背景 -->
    <rect x="0" y="0" width="400" height="180" rx="15" fill="url(#cardGradient2)" stroke="#26A69A" stroke-width="3" filter="url(#dropShadow)"/>

    <!-- 裝飾邊框 -->
    <rect x="5" y="5" width="390" height="170" rx="12" fill="none" stroke="#00BCD4" stroke-width="2" opacity="0.7"/>

    <!-- 標題 -->
    <text x="200" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C3E50">
      論點二：神的要求
    </text>
    <text x="200" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2C3E50" opacity="0.8">
      The Divine Requirement
    </text>

    <!-- 裝飾圖標 -->
    <circle cx="60" cy="90" r="25" fill="#26A69A" opacity="0.3"/>
    <path d="M40 90 L80 90 M60 70 L60 110" stroke="#26A69A" stroke-width="3" opacity="0.6"/>
    <circle cx="60" cy="90" r="10" fill="none" stroke="#26A69A" stroke-width="2" opacity="0.6"/>

    <!-- 內容 -->
    <text x="30" y="130" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">
      • 敬畏神為唯一要求
    </text>
    <text x="30" y="150" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">
      • 順服神的旨意
    </text>
    <text x="250" y="130" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">
      • 讓神在生命中做主
    </text>
    <text x="250" y="150" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">
      • 實踐信仰的本分
    </text>
  </g>

  <!-- 向下箭頭 2 -->
  <g transform="translate(380, 580)">
    <path d="M20 0 L20 60 L15 55 M20 60 L25 55" stroke="url(#arrowGradient)" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  </g>

  <!-- 第三張卡片：神的賜福 -->
  <g transform="translate(200, 640)">
    <!-- 卡片背景 -->
    <rect x="0" y="0" width="400" height="180" rx="15" fill="url(#cardGradient3)" stroke="#7CB342" stroke-width="3" filter="url(#dropShadow)"/>

    <!-- 裝飾邊框 -->
    <rect x="5" y="5" width="390" height="170" rx="12" fill="none" stroke="#8BC34A" stroke-width="2" opacity="0.7"/>

    <!-- 標題 -->
    <text x="200" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C3E50">
      論點三：神的賜福
    </text>
    <text x="200" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2C3E50" opacity="0.8">
      The Divine Blessings
    </text>

    <!-- 裝飾圖標 -->
    <circle cx="60" cy="90" r="25" fill="#7CB342" opacity="0.3"/>
    <path d="M42 90 L78 90 M60 72 L60 108" stroke="#7CB342" stroke-width="3" opacity="0.6"/>
    <circle cx="60" cy="90" r="15" fill="#7CB342" opacity="0.4"/>
    <circle cx="60" cy="90" r="8" fill="#7CB342" opacity="0.7"/>

    <!-- 內容 -->
    <text x="30" y="130" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">
      • 全方位供應與祝福
    </text>
    <text x="30" y="150" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">
      • 健康與長壽
    </text>
    <text x="250" y="130" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">
      • 智慧與能力
    </text>
    <text x="250" y="150" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">
      • 喜樂與永恆盼望
    </text>
  </g>
  
  <!-- 裝飾性連接線 -->
  <path d="M200 300 Q400 340 600 300" stroke="#FFD93D" stroke-width="3" fill="none" opacity="0.6"/>
  <circle cx="400" cy="340" r="8" fill="#FFD93D" opacity="0.8"/>

  <!-- 底部總結文字 -->
  <text x="400" y="880" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="url(#bottomGradient)">
    從困境 → 敬畏 → 賜福：通往璀璨人生的道路
  </text>
  <linearGradient id="bottomGradient" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
    <stop offset="50%" style="stop-color:#4ECDC4;stop-opacity:1" />
    <stop offset="100%" style="stop-color:#A8E6CF;stop-opacity:1" />
  </linearGradient>

  <!-- 裝飾星星 -->
  <g transform="translate(150, 920)">
    <path d="M0 -12 L4 -4 L12 0 L4 4 L0 12 L-4 4 L-12 0 L-4 -4 Z" fill="#FFD93D" opacity="0.7"/>
  </g>
  <g transform="translate(400, 900)">
    <path d="M0 -10 L3 -3 L10 0 L3 3 L0 10 L-3 3 L-10 0 L-3 -3 Z" fill="#FF6B6B" opacity="0.7"/>
  </g>
  <g transform="translate(650, 920)">
    <path d="M0 -12 L4 -4 L12 0 L4 4 L0 12 L-4 4 L-12 0 L-4 -4 Z" fill="#4ECDC4" opacity="0.7"/>
  </g>

  <!-- 參考文字 -->
  <text x="400" y="960" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6C757D" opacity="0.8">
    基於詩篇90篇：神人摩西的祈禱
  </text>

  <!-- 動態效果元素 -->
  <circle cx="150" cy="200" r="18" fill="#FF6B6B" opacity="0.3">
    <animate attributeName="r" values="18;28;18" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="250" r="22" fill="#4ECDC4" opacity="0.3">
    <animate attributeName="r" values="22;32;22" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="500" r="16" fill="#A8E6CF" opacity="0.3">
    <animate attributeName="r" values="16;26;16" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3.5s" repeatCount="indefinite"/>
  </circle>
</svg>