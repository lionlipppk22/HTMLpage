
<svg width="800" height="1500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1500">
  <defs>
    <!-- 漸層定義 -->
    <linearGradient id="timelineGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="phase1Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="phase2Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f87171;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="phase3Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="phase4Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    
    <!-- 陰影濾鏡 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
    
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="1500" fill="#f8fafc"/>
  
  <!-- 標題 -->
  <rect x="50" y="30" width="700" height="60" rx="10" fill="url(#timelineGradient)" filter="url(#shadow)"/>
  <text x="400" y="65" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="white">
    周不棄的人生軌跡：從億萬富翁到千萬負債的轉折
  </text>
  
  <!-- 時間軸主線 -->
  <rect x="395" y="100" width="10" height="1350" rx="5" fill="url(#timelineGradient)" opacity="0.3"/>
  <rect x="398" y="100" width="4" height="1350" rx="2" fill="url(#timelineGradient)"/>
  
  <!-- 階段一：早期累積與盲目自負 -->
  <g transform="translate(0, 120)">
    <!-- 時間圓點 -->
    <circle cx="400" cy="0" r="12" fill="url(#phase1Gradient)" filter="url(#shadow)"/>
    <circle cx="400" cy="0" r="6" fill="white"/>
    <circle cx="400" cy="0" r="3" fill="url(#phase1Gradient)"/>
    
    <!-- 階段標題 -->
    <rect x="50" y="-20" width="300" height="40" rx="8" fill="url(#phase1Gradient)" filter="url(#cardShadow)"/>
    <text x="200" y="5" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      I. 早期累積與盲目自負
    </text>
    <text x="200" y="35" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white" opacity="0.9">
      (2002 - 2018)
    </text>
    
    <!-- 事件卡片 1 -->
    <rect x="450" y="60" width="300" height="140" rx="10" fill="white" stroke="url(#phase1Gradient)" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="450" y="60" width="300" height="30" rx="10" fill="url(#phase1Gradient)" opacity="0.1"/>
    <text x="600" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="url(#phase1Gradient)">
      2002-2003：掙得第一桶金
    </text>
    <text x="460" y="105" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • 剛畢業即掙得第一桶金
    </text>
    <text x="460" y="125" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • 2003年掙到 1000萬，買房買車
    </text>
    <text x="460" y="145" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • 開始過著囂張跋扈的生活
    </text>
    <text x="460" y="165" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • 因潛層自卑感而揮霍證明自己
    </text>
    <text x="460" y="185" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="url(#phase1Gradient)">
      法則：財商不足
    </text>
    
    <!-- 事件卡片 2 -->
    <rect x="450" y="220" width="300" height="140" rx="10" fill="white" stroke="url(#phase1Gradient)" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="450" y="220" width="300" height="30" rx="10" fill="url(#phase1Gradient)" opacity="0.1"/>
    <text x="600" y="240" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="url(#phase1Gradient)">
      2015-2018：事業巔峰
    </text>
    <text x="460" y="265" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • 2015年成立影視公司
    </text>
    <text x="460" y="285" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • 巔峰期存款將近一億
    </text>
    <text x="460" y="305" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • 半年內貸款購買7套海外房產
    </text>
    <text x="460" y="325" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • 朋友前擁後簇，忽略家庭
    </text>
  </g>
  
  <!-- 階段二：危機降臨與錯誤決策 -->
  <g transform="translate(0, 520)">
    <!-- 時間圓點 -->
    <circle cx="400" cy="0" r="12" fill="url(#phase2Gradient)" filter="url(#shadow)"/>
    <circle cx="400" cy="0" r="6" fill="white"/>
    <circle cx="400" cy="0" r="3" fill="url(#phase2Gradient)"/>
    
    <!-- 階段標題 -->
    <rect x="450" y="-20" width="300" height="40" rx="8" fill="url(#phase2Gradient)" filter="url(#cardShadow)"/>
    <text x="600" y="5" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      II. 危機降臨與錯誤決策
    </text>
    <text x="600" y="35" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white" opacity="0.9">
      (2018年底 - 2020年初)
    </text>
    
    <!-- 事件卡片 1 -->
    <rect x="50" y="60" width="300" height="100" rx="10" fill="white" stroke="url(#phase2Gradient)" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="50" y="60" width="300" height="30" rx="10" fill="url(#phase2Gradient)" opacity="0.1"/>
    <text x="200" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="url(#phase2Gradient)">
      2018年底：外部環境惡化
    </text>
    <text x="60" y="105" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • 影視行業因政策整頓進入寒冬期
    </text>
    <text x="60" y="125" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • 行業環境急劇惡化
    </text>
    <text x="60" y="145" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • 收入來源開始萎缩
    </text>
    
    <!-- 事件卡片 2 -->
    <rect x="50" y="180" width="300" height="120" rx="10" fill="white" stroke="url(#phase2Gradient)" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="50" y="180" width="300" height="30" rx="10" fill="url(#phase2Gradient)" opacity="0.1"/>
    <text x="200" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="url(#phase2Gradient)">
      2019年底-2020年初：資金鏈斷裂
    </text>
    <text x="60" y="225" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • 重回餐飲業
    </text>
    <text x="60" y="245" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • 對疫情判斷失誤，逆勢擴張
    </text>
    <text x="60" y="265" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • 投入1000多萬，加速資金鏈斷裂
    </text>
    <text x="60" y="285" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="url(#phase2Gradient)">
      「憑運氣掙的錢憑實力虧掉」
    </text>
  </g>
  
  <!-- 階段三：谷底掙扎與生活巨變 -->
  <g transform="translate(0, 820)">
    <!-- 時間圓點 -->
    <circle cx="400" cy="0" r="12" fill="url(#phase3Gradient)" filter="url(#shadow)"/>
    <circle cx="400" cy="0" r="6" fill="white"/>
    <circle cx="400" cy="0" r="3" fill="url(#phase3Gradient)"/>
    
    <!-- 階段標題 -->
    <rect x="50" y="-20" width="300" height="40" rx="8" fill="url(#phase3Gradient)" filter="url(#cardShadow)"/>
    <text x="200" y="5" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      III. 谷底掙扎與生活巨變
    </text>
    <text x="200" y="35" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white" opacity="0.9">
      (2020 - 2023)
    </text>
    
    <!-- 事件卡片 1 -->
    <rect x="450" y="60" width="300" height="140" rx="10" fill="white" stroke="url(#phase3Gradient)" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="450" y="60" width="300" height="30" rx="10" fill="url(#phase3Gradient)" opacity="0.1"/>
    <text x="600" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="url(#phase3Gradient)">
      期間：負債與壓力
    </text>
    <text x="460" y="105" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • 總負債最高達1400-1500萬
    </text>
    <text x="460" y="125" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • 中年男人破產三件套成為最後稻草
    </text>
    <text x="460" y="145" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • 盲目投資損失最後400萬
    </text>
    <text x="460" y="165" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • 經歷半年多中度抑鬱
    </text>
    <text x="460" y="185" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • 從不抽菸變成一天三包煙
    </text>
    
    <!-- 事件卡片 2 -->
    <rect x="450" y="220" width="300" height="120" rx="10" fill="white" stroke="url(#phase3Gradient)" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="450" y="220" width="300" height="30" rx="10" fill="url(#phase3Gradient)" opacity="0.1"/>
    <text x="600" y="240" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="url(#phase3Gradient)">
      2023年9月：家庭衝擊
    </text>
    <text x="460" y="265" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • 被迫搬離生活25年的北京別墅
    </text>
    <text x="460" y="285" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • 女兒不能接受離開北京
    </text>
    <text x="460" y="305" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • 不願求助，不想讓人看到落魄一面
    </text>
    <text x="460" y="325" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="url(#phase3Gradient)">
      體會到家庭的溫暖
    </text>
  </g>
  
  <!-- 階段四：重生與新信念 -->
  <g transform="translate(0, 1200)">
    <!-- 時間圓點 -->
    <circle cx="400" cy="0" r="12" fill="url(#phase4Gradient)" filter="url(#shadow)"/>
    <circle cx="400" cy="0" r="6" fill="white"/>
    <circle cx="400" cy="0" r="3" fill="url(#phase4Gradient)"/>
    
    <!-- 階段標題 -->
    <rect x="450" y="-20" width="300" height="40" rx="8" fill="url(#phase4Gradient)" filter="url(#cardShadow)"/>
    <text x="600" y="5" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      IV. 重生與新信念
    </text>
    <text x="600" y="35" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white" opacity="0.9">
      (當前)
    </text>
    
    <!-- 事件卡片 -->
    <rect x="50" y="60" width="300" height="160" rx="10" fill="white" stroke="url(#phase4Gradient)" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="50" y="60" width="300" height="30" rx="10" fill="url(#phase4Gradient)" opacity="0.1"/>
    <text x="200" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="url(#phase4Gradient)">
      當前：重新出發
    </text>
    <text x="60" y="105" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • 開始自媒體創業
    </text>
    <text x="60" y="125" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • 收到1000多人鼓勵和2000多條私信
    </text>
    <text x="60" y="145" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • 考慮國外底層創業擺脫面子包袱
    </text>
    <text x="60" y="165" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • 認清自己的能力
    </text>
    <text x="60" y="185" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • 動力來自對父母和孩子的責任感
    </text>
    <text x="60" y="205" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="url(#phase4Gradient)">
      「只要我不放棄，沒有人可以讓我放棄」
    </text>
  </g>
  
  <!-- 底部說明 -->
  <text x="400" y="1460" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#6b7280" font-style="italic">
    時間軸來源：周不棄弟兄的人生見證
  </text>
</svg>