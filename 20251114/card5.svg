<svg width="360" height="640" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640">
  <defs>
    <!-- 呼吸光電路動畫效果 -->
    <linearGradient id="circuitGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#00b3ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:0.8" />
    </linearGradient>
    
    <!-- 五種顏色漸層 -->
    <linearGradient id="card1Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="card2Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="card3Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="card4Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="card5Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fee140;stop-opacity:1" />
    </linearGradient>
    
    <!-- 呼吸效果濾鏡 -->
    <filter id="breatheGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 陰影濾鏡 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
    
    <!-- 呼吸動畫 -->
    <style>
      @keyframes breathe {
        0%, 100% {
          stroke-width: 1.5;
          stroke: url(#circuitGradient);
          filter: drop-shadow(0 0 3px rgba(0, 187, 255, 0.4));
        }
        50% {
          stroke-width: 2.5;
          stroke: #00ffff;
          filter: drop-shadow(0 0 8px rgba(0, 255, 255, 0.6));
        }
      }
      
      @keyframes circuitPulse {
        0%, 100% {
          stroke-dashoffset: 0;
          stroke-width: 0.5;
          stroke-opacity: 0.4;
        }
        50% {
          stroke-dashoffset: -5;
          stroke-width: 1;
          stroke-opacity: 0.7;
        }
      }
      
      .breathe-border {
        animation: breathe 3s ease-in-out infinite;
      }
      
      .circuit-line {
        stroke-dasharray: 3 2;
        animation: circuitPulse 2s linear infinite;
      }
    </style>
  </defs>
  
  <!-- 背景 -->
  <rect width="360" height="640" fill="#1a202c"/>
  
  <!-- 卡片1：掌握元技能 -->
  <rect x="20" y="20" width="320" height="110" rx="8" fill="url(#card1Gradient)" filter="url(#shadow)"/>
  <rect x="20" y="20" width="320" height="110" rx="8" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" class="breathe-border"/>
  <rect x="25" y="25" width="310" height="100" rx="6" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="0.5" class="circuit-line"/>
  
  <!-- 標題區域 -->
  <rect x="20" y="20" width="320" height="30" rx="8" fill="rgba(255, 255, 255, 0.15)"/>
  <text x="180" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
    原則一：掌握元技能
  </text>
  
  <!-- 內容文字 -->
  <text x="35" y="65" font-family="Arial, sans-serif" font-size="10" fill="rgba(255, 255, 255, 0.9)">
    利用 AI 學習事物的基本原理
  </text>
  <text x="35" y="80" font-family="Arial, sans-serif" font-size="10" fill="rgba(255, 255, 255, 0.8)">
    • 專注本質而非工具操作
  </text>
  <text x="35" y="95" font-family="Arial, sans-serif" font-size="10" fill="rgba(255, 255, 255, 0.8)">
    • 看清成功形態並複製
  </text>
  <text x="35" y="110" font-family="Arial, sans-serif" font-size="10" fill="rgba(255, 255, 255, 0.8)">
    • 基本原理是永恆資產
  </text>
  
  <!-- 卡片2：問題優先思維 -->
  <rect x="20" y="140" width="320" height="110" rx="8" fill="url(#card2Gradient)" filter="url(#shadow)"/>
  <rect x="20" y="140" width="320" height="110" rx="8" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" class="breathe-border"/>
  <rect x="25" y="145" width="310" height="100" rx="6" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="0.5" class="circuit-line"/>
  
  <rect x="20" y="140" width="320" height="30" rx="8" fill="rgba(255, 255, 255, 0.15)"/>
  <text x="180" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
    原則二：問題優先的思維
  </text>
  
  <text x="35" y="185" font-family="Arial, sans-serif" font-size="10" fill="rgba(255, 255, 255, 0.9)">
    讓問題決定建構方向
  </text>
  <text x="35" y="200" font-family="Arial, sans-serif" font-size="10" fill="rgba(255, 255, 255, 0.8)">
    • 停止跳轉展示應用
  </text>
  <text x="35" y="215" font-family="Arial, sans-serif" font-size="10" fill="rgba(255, 255, 255, 0.8)">
    • 深入承諾一個問題
  </text>
  <text x="35" y="230" font-family="Arial, sans-serif" font-size="10" fill="rgba(255, 255, 255, 0.8)">
    • 圍繞問題深度構建
  </text>
  
  <!-- 卡片3：產品經理思維 -->
  <rect x="20" y="260" width="320" height="110" rx="8" fill="url(#card3Gradient)" filter="url(#shadow)"/>
  <rect x="20" y="260" width="320" height="110" rx="8" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" class="breathe-border"/>
  <rect x="25" y="265" width="310" height="100" rx="6" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="0.5" class="circuit-line"/>
  
  <rect x="20" y="260" width="320" height="30" rx="8" fill="rgba(255, 255, 255, 0.15)"/>
  <text x="180" y="280" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
    原則三：產品經理的思維
  </text>
  
  <text x="35" y="305" font-family="Arial, sans-serif" font-size="10" fill="rgba(255, 255, 255, 0.9)">
    結構化思考與規劃
  </text>
  <text x="35" y="320" font-family="Arial, sans-serif" font-size="10" fill="rgba(255, 255, 255, 0.8)">
    • PRO 框架的 P 階段
  </text>
  <text x="35" y="335" font-family="Arial, sans-serif" font-size="10" fill="rgba(255, 255, 255, 0.8)">
    • R 階段彌補漏洞
  </text>
  <text x="35" y="350" font-family="Arial, sans-serif" font-size="10" fill="rgba(255, 255, 255, 0.8)">
    • 避免模糊指令
  </text>
  
  <!-- 卡片4：聚焦用戶價值 -->
  <rect x="20" y="380" width="320" height="110" rx="8" fill="url(#card4Gradient)" filter="url(#shadow)"/>
  <rect x="20" y="380" width="320" height="110" rx="8" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" class="breathe-border"/>
  <rect x="25" y="385" width="310" height="100" rx="6" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="0.5" class="circuit-line"/>
  
  <rect x="20" y="380" width="320" height="30" rx="8" fill="rgba(255, 255, 255, 0.15)"/>
  <text x="180" y="400" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
    原則四：聚焦用戶價值
  </text>
  
  <text x="35" y="425" font-family="Arial, sans-serif" font-size="10" fill="rgba(255, 255, 255, 0.9)">
    為用戶創造真實價值
  </text>
  <text x="35" y="440" font-family="Arial, sans-serif" font-size="10" fill="rgba(255, 255, 255, 0.8)">
    • 深入理解真實需求
  </text>
  <text x="35" y="455" font-family="Arial, sans-serif" font-size="10" fill="rgba(255, 255, 255, 0.8)">
    • 完整產品生命週期
  </text>
  <text x="35" y="470" font-family="Arial, sans-serif" font-size="10" fill="rgba(255, 255, 255, 0.8)">
    • 經受真實世界考驗
  </text>
  
  <!-- 卡片5：AI協調能力 -->
  <rect x="20" y="500" width="320" height="110" rx="8" fill="url(#card5Gradient)" filter="url(#shadow)"/>
  <rect x="20" y="500" width="320" height="110" rx="8" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" class="breathe-border"/>
  <rect x="25" y="505" width="310" height="100" rx="6" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="0.5" class="circuit-line"/>
  
  <rect x="20" y="500" width="320" height="30" rx="8" fill="rgba(255, 255, 255, 0.15)"/>
  <text x="180" y="520" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
    原則五：AI 協調能力
  </text>
  
  <text x="35" y="545" font-family="Arial, sans-serif" font-size="10" fill="rgba(255, 255, 255, 0.9)">
    從工匠轉變為指揮家
  </text>
  <text x="35" y="560" font-family="Arial, sans-serif" font-size="10" fill="rgba(255, 255, 255, 0.8)">
    • 保持工具不可知論
  </text>
  <text x="35" y="575" font-family="Arial, sans-serif" font-size="10" fill="rgba(255, 255, 255, 0.8)">
    • 專注問題清晰度
  </text>
  <text x="35" y="590" font-family="Arial, sans-serif" font-size="10" fill="rgba(255, 255, 255, 0.8)">
    • 交付清晰規範給 AI
  </text>
</svg>
