<svg width="700" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 渐变背景 -->
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2530;stop-opacity:1" />
    </linearGradient>
    
    <!-- 呼吸光电路动画效果 -->
    <linearGradient id="circuitGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#00b3ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:0.8" />
    </linearGradient>
    
    <!-- 呼吸效果滤镜 -->
    <filter id="breatheGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 电路线条滤镜 -->
    <filter id="circuitGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    
    <!-- 呼吸动画 -->
    <style>
      @keyframes breathe {
        0%, 100% {
          stroke-width: 2;
          stroke: url(#circuitGradient);
          filter: drop-shadow(0 0 5px rgba(0, 187, 255, 0.6));
          transform: scale(1);
        }
        25% {
          stroke-width: 3;
          stroke: #00ffff;
          filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.8));
          transform: scale(1.005);
        }
        50% {
          stroke-width: 4;
          stroke: #0066ff;
          filter: drop-shadow(0 0 15px rgba(0, 102, 255, 0.9));
          transform: scale(1.01);
        }
        75% {
          stroke-width: 3;
          stroke: #00b3ff;
          filter: drop-shadow(0 0 10px rgba(0, 179, 255, 0.8));
          transform: scale(1.005);
        }
      }
      
      @keyframes circuitPulse {
        0%, 100% {
          stroke-dashoffset: 0;
          stroke-opacity: 0.6;
        }
        50% {
          stroke-dashoffset: -10;
          stroke-opacity: 1;
        }
      }
      
      .breathe-border {
        animation: breathe 3s ease-in-out infinite;
      }
      
      .circuit-line {
        stroke-dasharray: 5 3;
        animation: circuitPulse 2s linear infinite;
      }
    </style>
  </defs>
  
  <!-- 卡片背景 -->
  <rect x="15" y="15" width="670" height="470" rx="15" fill="url(#cardGradient)" filter="url(#shadow)"/>
  
  <!-- 呼吸光电路边框 -->
  <rect x="15" y="15" width="670" height="470" rx="15" fill="none" stroke="url(#circuitGradient)" stroke-width="2" class="breathe-border"/>
  
  <!-- 电路线条装饰 -->
  <rect x="20" y="20" width="660" height="460" rx="12" fill="none" stroke="url(#circuitGradient)" stroke-width="1" filter="url(#circuitGlow)" class="circuit-line"/>
  <rect x="25" y="25" width="650" height="450" rx="10" fill="none" stroke="rgba(0, 187, 255, 0.3)" stroke-width="0.5" filter="url(#circuitGlow)" class="circuit-line"/>
  
  <!-- 角落电路装饰 -->
  <path d="M15,15 L40,15 L40,40 L15,40 Z" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
  <path d="M645,15 L685,15 L685,40 L645,40 Z" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
  <path d="M15,455 L40,455 L40,485 L15,485 Z" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
  <path d="M645,455 L685,455 L685,485 L645,485 Z" fill="none" stroke="url(#circuitGradient)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
  
  <!-- 标题背景 -->
  <rect x="15" y="15" width="670" height="50" rx="15" fill="#3498db"/>
  <rect x="15" y="55" width="670" height="15" fill="#3498db"/>
  
  <!-- 标题文字 -->
  <text x="350" y="45" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="white">
    論點綱要卡片：理性迴避過濾器
  </text>
  
  <!-- 内容区域 -->
  <!-- 定义部分 -->
  <text x="30" y="100" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#3498db">
    定義：
  </text>
  <text x="30" y="125" font-family="Arial, sans-serif" font-size="16" fill="#ecf0f1">
    一種主動的、基於品格的決策框架，其核心是將精力專注於「避開」
  </text>
  <text x="30" y="145" font-family="Arial, sans-serif" font-size="16" fill="#ecf0f1">
    低品質、不正直的人與事，而非「尋找」絕佳的機會。這是一種最高
  </text>
  <text x="30" y="165" font-family="Arial, sans-serif" font-size="16" fill="#ecf0f1">
    級別的財務與情感資本保全術。
  </text>
  
  <!-- 方法/步骤部分 -->
  <text x="30" y="200" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#3498db">
    方法/步驟：
  </text>
  <text x="30" y="225" font-family="Arial, sans-serif" font-size="16" fill="#ecf0f1">
    1. 首要問題：「我正在與誰打交道？」將品格置於利益之前。
  </text>
  <text x="30" y="245" font-family="Arial, sans-serif" font-size="16" fill="#ecf0f1">
    2. 應用兩道測試：
  </text>
  <text x="50" y="265" font-family="Arial, sans-serif" font-size="16" fill="#ecf0f1">
    a. 我是否能清晰地理解此人/此事？（簡潔性測試）
  </text>
  <text x="50" y="285" font-family="Arial, sans-serif" font-size="16" fill="#ecf0f1">
    b. 他/它是否有可持續的道德/商業優勢？（正直性測試）
  </text>
  <text x="30" y="305" font-family="Arial, sans-serif" font-size="16" fill="#ecf0f1">
    3. 偵測警示信號：留意誇大、推卸責任、言行不一等危險信號。
  </text>
  <text x="30" y="325" font-family="Arial, sans-serif" font-size="16" fill="#ecf0f1">
    4. 執行原則：一旦發現明確的品格瑕疵，立即、無條件地退出。
  </text>
  
  <!-- 核心范例部分 -->
  <text x="30" y="360" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#3498db">
    核心範例：
  </text>
  <text x="30" y="385" font-family="Arial, sans-serif" font-size="16" fill="#ecf0f1">
    - 商業：「98%的提案在第一句話就被拒絕，因為人不對。」
  </text>
  <text x="30" y="405" font-family="Arial, sans-serif" font-size="16" fill="#ecf0f1">
    - 生活：「不與那些將承諾視為建議的人建立深度關係。」
  </text>
  <text x="30" y="425" font-family="Arial, sans-serif" font-size="16" fill="#ecf0f1">
    - 信仰：「警惕那些承諾過多奇蹟、需要熱情而非證據的教導。」
  </text>
</svg>