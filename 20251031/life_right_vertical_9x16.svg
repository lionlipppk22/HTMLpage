<svg width="540" height="960" viewBox="0 0 540 960" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 漸層定義 -->
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:0.7" />
    </linearGradient>
    
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffecd2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fcb69f;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="stepGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bfdbfe;stop-opacity:1" />
    </linearGradient>
    
    <!-- 陰影效果 -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="540" height="960" fill="url(#backgroundGradient)" rx="20"/>
  
  <!-- 主標題區 -->
  <g filter="url(#shadow)">
    <rect x="20" y="20" width="500" height="100" fill="url(#cardGradient)" rx="15" stroke="#fff" stroke-width="2"/>
    <text x="270" y="55" text-anchor="middle" font-family="serif" font-size="28" font-weight="bold" fill="#1e3a8a">
      生命權絕對論論點綱要
    </text>
    <text x="270" y="85" text-anchor="middle" font-family="serif" font-size="14" fill="#374151">
      基於神聖形象理論的邏輯推導
    </text>
  </g>

  <!-- 核心論點 -->
  <g filter="url(#shadow)">
    <rect x="20" y="140" width="500" height="100" fill="url(#cardGradient)" rx="15" stroke="#3B82F6" stroke-width="3"/>
    <text x="270" y="170" text-anchor="middle" font-family="serif" font-size="22" font-weight="bold" fill="#1e40af">
      核心論點
    </text>
    <rect x="40" y="185" width="460" height="50" fill="url(#stepGradient)" rx="10" stroke="#3B82F6" stroke-width="2"/>
    <text x="270" y="210" text-anchor="middle" font-family="serif" font-size="16" font-weight="600" fill="#1e3a8a">
      生命權至高無上且絕對
    </text>
    <text x="270" y="230" text-anchor="middle" font-family="serif" font-size="13" fill="#374151">
      不可因任何負擔、不便或情境而被剝奪或權衡
    </text>
  </g>

  <!-- 論證流程 -->
  <g filter="url(#shadow)">
    <rect x="20" y="260" width="500" height="550" fill="url(#cardGradient)" rx="15" stroke="#8B5CF6" stroke-width="3"/>
    <text x="270" y="290" text-anchor="middle" font-family="serif" font-size="20" font-weight="bold" fill="#5b21b6">
      邏輯推導步驟
    </text>
    
    <!-- 步驟1 -->
    <g>
      <circle cx="70" cy="350" r="20" fill="#3B82F6" stroke="#fff" stroke-width="2" filter="url(#glow)"/>
      <text x="70" y="355" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1</text>
      <rect x="100" y="325" width="380" height="50" fill="url(#stepGradient)" rx="8" stroke="#3B82F6" stroke-width="2"/>
      <text x="290" y="345" text-anchor="middle" font-family="serif" font-size="14" font-weight="bold" fill="#1e40af">前提基礎</text>
      <text x="290" y="365" text-anchor="middle" font-family="serif" font-size="12" fill="#374151">所有人類皆依「神聖形象」所造</text>
      <!-- 下箭頭 -->
      <path d="M 70 380 L 70 390" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrowhead)"/>
    </g>
    
    <!-- 步驟2 -->
    <g>
      <circle cx="70" cy="430" r="20" fill="#3B82F6" stroke="#fff" stroke-width="2" filter="url(#glow)"/>
      <text x="70" y="435" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">2</text>
      <rect x="100" y="405" width="380" height="50" fill="url(#stepGradient)" rx="8" stroke="#3B82F6" stroke-width="2"/>
      <text x="290" y="425" text-anchor="middle" font-family="serif" font-size="14" font-weight="bold" fill="#1e40af">神聖推論</text>
      <text x="290" y="445" text-anchor="middle" font-family="serif" font-size="12" fill="#374151">每個生命都是神聖且獨特</text>
      <!-- 下箭頭 -->
      <path d="M 70 460 L 70 470" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrowhead)"/>
    </g>
    
    <!-- 步驟3 -->
    <g>
      <circle cx="70" cy="510" r="20" fill="#3B82F6" stroke="#fff" stroke-width="2" filter="url(#glow)"/>
      <text x="70" y="515" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">3</text>
      <rect x="100" y="485" width="380" height="50" fill="url(#stepGradient)" rx="8" stroke="#3B82F6" stroke-width="2"/>
      <text x="290" y="505" text-anchor="middle" font-family="serif" font-size="14" font-weight="bold" fill="#1e40af">生命確認</text>
      <text x="290" y="525" text-anchor="middle" font-family="serif" font-size="12" fill="#374151">子宫內的胎兒是人類</text>
      <!-- 下箭頭 -->
      <path d="M 70 540 L 70 550" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrowhead)"/>
    </g>
    
    <!-- 步驟4 -->
    <g>
      <circle cx="70" cy="590" r="20" fill="#3B82F6" stroke="#fff" stroke-width="2" filter="url(#glow)"/>
      <text x="70" y="595" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">4</text>
      <rect x="100" y="565" width="380" height="50" fill="url(#stepGradient)" rx="8" stroke="#3B82F6" stroke-width="2"/>
      <text x="290" y="585" text-anchor="middle" font-family="serif" font-size="14" font-weight="bold" fill="#1e40af">權利賦予</text>
      <text x="290" y="605" text-anchor="middle" font-family="serif" font-size="12" fill="#374151">胎兒擁有絕對生命權</text>
      <!-- 下箭頭 -->
      <path d="M 70 620 L 70 630" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrowhead)"/>
    </g>
    
    <!-- 步驟5 -->
    <g>
      <circle cx="70" cy="670" r="20" fill="#8B5CF6" stroke="#fff" stroke-width="2" filter="url(#glow)"/>
      <text x="70" y="675" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">5</text>
      <rect x="100" y="645" width="380" height="50" fill="#f3e8ff" rx="8" stroke="#8B5CF6" stroke-width="2"/>
      <text x="290" y="665" text-anchor="middle" font-family="serif" font-size="14" font-weight="bold" fill="#5b21b6">行為定義</text>
      <text x="290" y="685" text-anchor="middle" font-family="serif" font-size="12" fill="#374151">墮胎是消除人類生命</text>
      <!-- 下箭頭 -->
      <path d="M 70 700 L 70 710" stroke="#EF4444" stroke-width="2" marker-end="url(#arrowhead)"/>
    </g>
    
    <!-- 步驟6 -->
    <g>
      <circle cx="70" cy="750" r="20" fill="#EF4444" stroke="#fff" stroke-width="2" filter="url(#glow)"/>
      <text x="70" y="755" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">6</text>
      <rect x="100" y="725" width="380" height="50" fill="#fef2f2" rx="8" stroke="#EF4444" stroke-width="2"/>
      <text x="290" y="745" text-anchor="middle" font-family="serif" font-size="14" font-weight="bold" fill="#dc2626">最終裁決</text>
      <text x="290" y="765" text-anchor="middle" font-family="serif" font-size="12" fill="#374151">墮胎等同謀殺</text>
    </g>
  </g>

  <!-- 箭頭標記定義 -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8B5CF6"/>
    </marker>
  </defs>

  <!-- 底部信息區 -->
  <g filter="url(#shadow)">
    <!-- 定義 -->
    <rect x="20" y="830" width="160" height="110" fill="url(#cardGradient)" rx="12" stroke="#10B981" stroke-width="2"/>
    <text x="100" y="855" text-anchor="middle" font-family="serif" font-size="16" font-weight="bold" fill="#047857">核心定義</text>
    <text x="100" y="875" text-anchor="middle" font-family="serif" font-size="11" fill="#374151">人類生命自形成即擁有</text>
    <text x="100" y="890" text-anchor="middle" font-family="serif" font-size="11" fill="#374151">神聖且不可侵犯的</text>
    <text x="100" y="905" text-anchor="middle" font-family="serif" font-size="11" fill="#374151">生命權</text>
    <text x="100" y="925" text-anchor="middle" font-family="serif" font-size="10" fill="#6B7280">- 每個人都有相同價值</text>
    
    <!-- 挑戰 -->
    <rect x="190" y="830" width="160" height="110" fill="url(#cardGradient)" rx="12" stroke="#F59E0B" stroke-width="2"/>
    <text x="270" y="855" text-anchor="middle" font-family="serif" font-size="16" font-weight="bold" fill="#B45309">面臨挑戰</text>
    <text x="270" y="875" text-anchor="middle" font-family="serif" font-size="11" fill="#374151">身體自主權衝突</text>
    <text x="270" y="890" text-anchor="middle" font-family="serif" font-size="11" fill="#374151">情境倫理考量</text>
    <text x="270" y="905" text-anchor="middle" font-family="serif" font-size="11" fill="#374151">法律人格框架</text>
    <text x="270" y="925" text-anchor="middle" font-family="serif" font-size="10" fill="#6B7280">- 實用性vs原則性</text>
    
    <!-- 引文 -->
    <rect x="360" y="830" width="160" height="110" fill="url(#cardGradient)" rx="12" stroke="#EF4444" stroke-width="2"/>
    <text x="440" y="855" text-anchor="middle" font-family="serif" font-size="16" font-weight="bold" fill="#DC2626">關鍵引文</text>
    <text x="440" y="875" text-anchor="middle" font-family="serif" font-size="11" fill="#374151">"沒有任何藉口</text>
    <text x="440" y="890" text-anchor="middle" font-family="serif" font-size="11" fill="#374151">可以謀殺。句號。"</text>
    <text x="440" y="905" text-anchor="middle" font-family="serif" font-size="11" fill="#374151">- 絕對主義立場</text>
    <text x="440" y="925" text-anchor="middle" font-family="serif" font-size="10" fill="#6B7280">- 無例外原則</text>
  </g>

  <!-- 頁面底部裝飾 -->
  <g>
    <rect x="20" y="950" width="500" height="10" fill="url(#backgroundGradient)" rx="5" opacity="0.7"/>
    <text x="270" y="970" text-anchor="middle" font-family="serif" font-size="12" fill="#6B7280">
      生命權絕對論 | 神聖形象理論應用
    </text>
  </g>
</svg>