<svg width="500" height="1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 中心圓漸層 -->
    <linearGradient id="mindmapGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991b1b;stop-opacity:1" />
    </linearGradient>
    
    <!-- 要素1漸層 (在恩典中剛強) -->
    <linearGradient id="graceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c2d12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#431407;stop-opacity:1" />
    </linearGradient>
    
    <!-- 要素2漸層 (三大心志事奉) -->
    <linearGradient id="ministryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c4a6e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>
    
    <!-- 要素3漸層 (效法受苦榜樣) -->
    <linearGradient id="exampleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#134e4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#115e59;stop-opacity:1" />
    </linearGradient>
    
    <!-- 呼吸動畫效果 -->
    <filter id="breatheGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 呼吸動畫 CSS -->
    <style>
      @keyframes mindmapBreathe {
        0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.3));
        }
        50% {
          transform: scale(1.02);
          filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.6));
        }
      }
      
      @keyframes elementBreathe {
        0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.4));
        }
        50% {
          transform: scale(1.01);
          filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.7));
        }
      }
      
      .breathe-center {
        animation: mindmapBreathe 4s ease-in-out infinite;
      }
      
      .breathe-element {
        animation: elementBreathe 3s ease-in-out infinite;
      }
    </style>
    
    <!-- 陰影效果 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect x="10" y="10" width="480" height="969" rx="15" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  
  <!-- 標題背景 -->
  <rect x="10" y="10" width="480" height="70" rx="15" fill="#991b1b"/>
  
  <!-- 標題文字 -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
    提摩太後書核心主題
  </text>
  <text x="250" y="55" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="white">
    與主同受苦難，同作君王
  </text>
  
  <!-- 中心圓 -->
  <circle cx="250" cy="160" r="65" fill="url(#mindmapGradient)" stroke="#e5e7eb" stroke-width="3" filter="url(#shadow)" class="breathe-center"/>
  <text x="250" y="150" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    提摩太後書
  </text>
  <text x="250" y="170" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">
    核心主題
  </text>
  
  <!-- 連接線 -->
  <line x1="250" y1="225" x2="250" y2="300" stroke="#dc2626" stroke-width="3"/>
  <line x1="250" y1="410" x2="250" y2="480" stroke="#dc2626" stroke-width="3"/>
  <line x1="250" y1="590" x2="250" y2="660" stroke="#dc2626" stroke-width="3"/>
  
  <!-- 要素1：在恩典中剛強 -->
  <rect x="50" y="300" width="400" height="110" rx="10" fill="url(#graceGradient)" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)" class="breathe-element"/>
  <text x="250" y="320" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
    1. 在恩典中剛強
  </text>
  <text x="250" y="350" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fde68a">
    真正的剛強並非源於血氣、能力或小聰明
  </text>
  <text x="250" y="375" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fde68a">
    完全倚靠神，按神的方法做神的工作
  </text>
  <text x="250" y="400" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fbbf24">
    在基督耶穌的恩典上找到的堅韌力量
  </text>
  
  <!-- 要素2：以三大心志事奉 -->
  <rect x="50" y="480" width="400" height="110" rx="10" fill="url(#ministryGradient)" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)" class="breathe-element"/>
  <text x="250" y="500" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
    2. 以三大心志事奉
  </text>
  <text x="250" y="530" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#bfdbfe">
    如同精兵般的專注，不被世務纏身
  </text>
  <text x="250" y="555" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#bfdbfe">
    如同比武者般的紀律，嚴格裝備自己
  </text>
  <text x="250" y="580" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#93c5fd">
    如同農夫般的勤勞，忠心勞苦，期待收成
  </text>
  
  <!-- 要素3：效法受苦榜樣 -->
  <rect x="50" y="660" width="400" height="110" rx="10" fill="url(#exampleGradient)" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)" class="breathe-element"/>
  <text x="250" y="680" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
    3. 效法受苦榜樣
  </text>
  <text x="250" y="710" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#a7f3d0">
    耶穌基督：受苦、受死、復活、得榮耀
  </text>
  <text x="250" y="735" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#a7f3d0">
    使徒保羅：被囚經歷證明神的道不被捆綁
  </text>
  <text x="250" y="760" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#6ee7b7">
    苦難之後必有榮耀
  </text>
</svg>