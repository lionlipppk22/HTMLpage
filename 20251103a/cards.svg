<svg width="600" height="920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Card 1 Gradients -->
    <linearGradient id="cardGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a5568;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d3748;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circuitGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#00b3ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:0.8" />
    </linearGradient>

    <!-- Card 2 Gradients -->
    <linearGradient id="cardGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b46c1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#553c9a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circuitGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff00ff;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#e600e6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc00cc;stop-opacity:0.8" />
    </linearGradient>

    <!-- Card 3 Gradients -->
    <linearGradient id="cardGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38a169;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2f855a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circuitGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff00;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#00e600;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cc00;stop-opacity:0.8" />
    </linearGradient>
    
    <!-- 呼吸效果濾鏡 -->
    <filter id="breatheGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 電路線條濾鏡 -->
    <filter id="circuitGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 呼吸動畫 -->
    <style>
      @keyframes breathe {
        0%, 100% {
          stroke-width: 2;
          stroke: url(#circuitGradient1); /* Default, will be overridden by specific card styles */
          filter: drop-shadow(0 0 5px rgba(0, 187, 255, 0.6));
          transform: scale(1);
        }
        25% {
          stroke-width: 3;
          stroke: #00ffff;
          filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.8));
          transform: scale(1.005);
        }
        50% {
          stroke-width: 4;
          stroke: #0066ff;
          filter: drop-shadow(0 0 15px rgba(0, 102, 255, 0.9));
          transform: scale(1.01);
        }
        75% {
          stroke-width: 3;
          stroke: #00b3ff;
          filter: drop-shadow(0 0 10px rgba(0, 179, 255, 0.8));
          transform: scale(1.005);
        }
      }
      
      @keyframes circuitPulse {
        0%, 100% {
          stroke-dashoffset: 0;
          stroke-opacity: 0.6;
        }
        50% {
          stroke-dashoffset: -10;
          stroke-opacity: 1;
        }
      }
      
      .breathe-border {
        animation: breathe 3s ease-in-out infinite;
      }
      
      .circuit-line {
        stroke-dasharray: 5 3;
        animation: circuitPulse 2s linear infinite;
      }
    </style>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Card 1: 基督的精兵 -->
  <!-- 卡片背景 -->
  <rect x="10" y="10" width="580" height="280" rx="10" fill="url(#cardGradient1)" filter="url(#shadow)"/>
  
  <!-- 呼吸光電路邊框 -->
  <rect x="10" y="10" width="580" height="280" rx="10" fill="none" stroke="url(#circuitGradient1)" stroke-width="2" class="breathe-border"/>
  
  <!-- 電路線條裝飾 -->
  <rect x="15" y="15" width="570" height="270" rx="8" fill="none" stroke="url(#circuitGradient1)" stroke-width="1" filter="url(#circuitGlow)" class="circuit-line"/>
  <rect x="20" y="20" width="560" height="260" rx="6" fill="none" stroke="rgba(0, 187, 255, 0.3)" stroke-width="0.5" filter="url(#circuitGlow)" class="circuit-line"/>
  
  <!-- 角落電路裝飾 -->
  <path d="M10, 10 L30, 10 L30, 30 L10, 30 Z" fill="none" stroke="url(#circuitGradient1)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
  <path d="M570, 10 L590, 10 L590, 30 L570, 30 Z" fill="none" stroke="url(#circuitGradient1)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
  <path d="M10, 270 L30, 270 L30, 290 L10, 290 Z" fill="none" stroke="url(#circuitGradient1)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
  <path d="M570, 270 L590, 270 L590, 290 L570, 290 Z" fill="none" stroke="url(#circuitGradient1)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
  
  <!-- 標題背景 -->
  <rect x="10" y="10" width="580" height="40" rx="10" fill="#3182ce"/>
  <rect x="10" y="40" width="580" height="10" fill="#3182ce"/>
  
  <!-- 標題文字 -->
  <text x="300" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
    基督的精兵
  </text>

  <text x="25" y="70" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0">
    定義：
  </text>
  <text x="25" y="95" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e0">
    一位為屬靈爭戰而被呼召的戰士。
  </text>

  <text x="25" y="132.5" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0">
    核心要求：
  </text>
  <text x="25" y="157.5" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e0">
    專注、警醒，不被世俗事務所纏繞和分心。
  </text>

  <text x="25" y="195" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0">
    事奉應用：
  </text>
  <text x="25" y="220" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e0">
    在生活中保持屬靈的敏銳度，明白自己正為基督打美好的仗，專心討主的喜悅。
  </text>

  <!-- Card 2: 場上的比武者 -->
  <!-- 卡片背景 -->
  <rect x="10" y="320" width="580" height="280" rx="10" fill="url(#cardGradient2)" filter="url(#shadow)"/>
  
  <!-- 呼吸光電路邊框 -->
  <rect x="10" y="320" width="580" height="280" rx="10" fill="none" stroke="url(#circuitGradient2)" stroke-width="2" class="breathe-border"/>
  
  <!-- 電路線條裝飾 -->
  <rect x="15" y="325" width="570" height="270" rx="8" fill="none" stroke="url(#circuitGradient2)" stroke-width="1" filter="url(#circuitGlow)" class="circuit-line"/>
  <rect x="20" y="330" width="560" height="260" rx="6" fill="none" stroke="rgba(255, 0, 255, 0.3)" stroke-width="0.5" filter="url(#circuitGlow)" class="circuit-line"/>
  
  <!-- 角落電路裝飾 -->
  <path d="M10, 320 L30, 320 L30, 340 L10, 340 Z" fill="none" stroke="url(#circuitGradient2)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
  <path d="M570, 320 L590, 320 L590, 340 L570, 340 Z" fill="none" stroke="url(#circuitGradient2)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
  <path d="M10, 580 L30, 580 L30, 600 L10, 600 Z" fill="none" stroke="url(#circuitGradient2)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
  <path d="M570, 580 L590, 580 L590, 600 L570, 600 Z" fill="none" stroke="url(#circuitGradient2)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
  
  <!-- 標題背景 -->
  <rect x="10" y="320" width="580" height="40" rx="10" fill="#805ad5"/>
  <rect x="10" y="350" width="580" height="10" fill="#805ad5"/>
  
  <!-- 標題文字 -->
  <text x="300" y="345" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
    場上的比武者
  </text>

  <text x="25" y="380" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0">
    定義：
  </text>
  <text x="25" y="405" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e0">
    一位追求卓越，渴望贏得冠冕的運動員。
  </text>

  <text x="25" y="442.5" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0">
    核心要求：
  </text>
  <text x="25" y="467.5" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e0">
    嚴格的紀律、持續的訓練、完全的自制，並遵守真理的規則。
  </text>

  <text x="25" y="505" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0">
    事奉應用：
  </text>
  <text x="25" y="530" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e0">
    在真理、品格和事奉技能上不斷裝備自己，追求專業，以嚴謹的態度對待每一次服事。
  </text>

  <!-- Card 3: 勞力的農夫 -->
  <!-- 卡片背景 -->
  <rect x="10" y="630" width="580" height="280" rx="10" fill="url(#cardGradient3)" filter="url(#shadow)"/>
  
  <!-- 呼吸光電路邊框 -->
  <rect x="10" y="630" width="580" height="280" rx="10" fill="none" stroke="url(#circuitGradient3)" stroke-width="2" class="breathe-border"/>
  
  <!-- 電路線條裝飾 -->
  <rect x="15" y="635" width="570" height="270" rx="8" fill="none" stroke="url(#circuitGradient3)" stroke-width="1" filter="url(#circuitGlow)" class="circuit-line"/>
  <rect x="20" y="640" width="560" height="260" rx="6" fill="none" stroke="rgba(0, 255, 0, 0.3)" stroke-width="0.5" filter="url(#circuitGlow)" class="circuit-line"/>
  
  <!-- 角落電路裝飾 -->
  <path d="M10, 630 L30, 630 L30, 650 L10, 650 Z" fill="none" stroke="url(#circuitGradient3)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
  <path d="M570, 630 L590, 630 L590, 650 L570, 650 Z" fill="none" stroke="url(#circuitGradient3)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
  <path d="M10, 890 L30, 890 L30, 910 L10, 910 Z" fill="none" stroke="url(#circuitGradient3)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
  <path d="M570, 890 L590, 890 L590, 910 L570, 910 Z" fill="none" stroke="url(#circuitGradient3)" stroke-width="1.5" filter="url(#circuitGlow)" class="circuit-line"/>
  
  <!-- 標題背景 -->
  <rect x="10" y="630" width="580" height="40" rx="10" fill="#38a169"/>
  <rect x="10" y="660" width="580" height="10" fill="#38a169"/>
  
  <!-- 標題文字 -->
  <text x="300" y="655" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">
    勞力的農夫
  </text>

  <text x="25" y="690" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0">
    定義：
  </text>
  <text x="25" y="715" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e0">
    一位在田地裡忠心耕耘、期待收成的勞動者。
  </text>

  <text x="25" y="752.5" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0">
    核心要求：
  </text>
  <text x="25" y="777.5" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e0">
    勤勞、忍耐、忠於職守，不辭辛勞。
  </text>

  <text x="25" y="815" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0">
    事奉應用：
  </text>
  <text x="25" y="840" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e0">
    以勤奮的態度投入事奉，並確信神的供應與獎賞是理所當然的，忠心勞苦必不徒然。
  </text>
</svg>