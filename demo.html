    <style>
        /* From reference.md */
        p {

        }

        }

        .markdown-preview h1 {

            border-radius: 10px;
        }

        /* Collapsible Section Styles */
        .collapsible-section {
            margin-bottom: 20px;
            border-radius: 8px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .collapsible-section p {
            margin: 0;
            padding: 0.5em;
            font-size: 1.6em;
            font-family: Chiron GoRound TC;
        }

        .collapsible-header {
            padding: 15px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.3s ease;
        }

        .collapsible-header:hover {
            background: linear-gradient(135deg, #5a6fd8 0%, #6a4190 100%);
        }

        .collapsible-header h2 {
            margin: 0;
            padding: 0;
            background: none;
            color: white;
            font-size: 1.5em;
        }

        .collapsible-icon {
            transition: transform 0.3s ease;
            width: 24px;
            height: 24px;
        }

        .collapsible-section.collapsed .collapsible-icon {
            transform: rotate(-90deg);
        }

        .collapsible-content {
            padding: 20px;
            transition: max-height 0.3s ease;
            max-height: 20000px;
            overflow: hidden;
        }

        .collapsible-section.collapsed .collapsible-content {
            max-height: 0;
            padding: 0 20px;
        }
    </style>

<body class="mobile-layout">

    <!-- Add keywords config for highlighting -->
    <script id="keywords-config" type="application/json">
    {

    }

    <script>
        // 确保TOC功能和折叠功能正常工作
        document.addEventListener('DOMContentLoaded', function () {
            // 初始化TOC
            if (typeof generateTOC === 'function') {
                generateTOC();
            }

            // 确保TOC按钮点击事件正常工作
            const tocBtn = document.querySelector('[onclick="toggleTOC()"]');
            if (tocBtn) {
                tocBtn.addEventListener('click', function (e) {
                    e.preventDefault();
                    toggleTOC();
                });
            }

            // 初始化折叠功能
            setupCollapsibleSections();
        });

        // 定义toggleTOC函数（如果layout.js未正确加载）
        let tocVisible = false;
        function toggleTOC() {
            const toc = document.getElementById('toc');
            if (!toc) return;

            if (!tocVisible) {
                toc.classList.add('show');
                tocVisible = true;
            } else {
                toc.classList.remove('show');
                tocVisible = false;
            }
        }

        // 定义generateTOC函数（如果layout.js未正确加载）
        function generateTOC() {
            const tocList = document.getElementById('toc-list');
            if (!tocList) return;

            // Clear existing to avoid duplicates
            tocList.innerHTML = '';

            const headers = document.querySelectorAll('h2');

            headers.forEach((header, index) => {
                if (!header.id) {
                    header.id = `section-${index + 1}`;
                }

                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = `#${header.id}`;
                a.textContent = header.textContent;

                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    header.scrollIntoView({
                        behavior: 'smooth'
                    });
                    if (window.innerWidth < 768 && typeof toggleTOC === 'function') {
                        toggleTOC();
                    }
                });

                li.appendChild(a);
                tocList.appendChild(li);
            });
        }

        // 设置折叠功能
        function setupCollapsibleSections() {
            const contentContainer = document.querySelector('.markdown-preview');
            if (!contentContainer) return;

            const headers = Array.from(contentContainer.querySelectorAll('h2'));

            headers.forEach(header => {
                // 避免重复处理
                if (header.parentNode.classList.contains('collapsible-header')) return;

                // 创建section容器
                const section = document.createElement('div');
                section.className = 'collapsible-section';

                // 创建header容器
                const headerDiv = document.createElement('div');
                headerDiv.className = 'collapsible-header';

                // 图标
                const icon = document.createElement('span');
                icon.className = 'collapsible-icon';
                icon.innerHTML = '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>';

                // 在header前插入section
                if (header.parentNode) {
                    header.parentNode.insertBefore(section, header);

                    // 将header移入headerDiv
                    headerDiv.appendChild(header);
                    headerDiv.appendChild(icon);
                    section.appendChild(headerDiv);

                    // 创建内容容器
                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'collapsible-content';
                    section.appendChild(contentDiv);

                    // 将后续兄弟节点移入contentDiv
                    let nextNode = section.nextSibling;
                    while (nextNode) {
                        // 在下一个H2或H1处停止
                        if (nextNode.nodeName === 'H2' || nextNode.nodeName === 'H1') {
                            break;
                        }
                        const sibling = nextNode;
                        nextNode = nextNode.nextSibling;
                        contentDiv.appendChild(sibling);
                    }

                    // 添加点击事件
                    headerDiv.addEventListener('click', () => {
                        section.classList.toggle('collapsed');
                    });
                }
            });
        }
    </script>
